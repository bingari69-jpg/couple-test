<section class="info-hero"><p class="info-eyebrow">여러분의 이야기를 기다려요</p><h1>같이놀자에게<br>할 말이 있나요?</h1><p class="lead">불편했던 점, 좋았던 점, 새로 있었으면 하는 편지나 게임을 편하게 알려주세요.</p></section>
<form class="form-card" id="inquiryForm" data-kind="feedback"><div class="form-grid">
 <div class="form-field"><label for="category">이야기 종류</label><select id="category" name="category" required><option value="">골라주세요</option><option>이런 기능이 필요해요</option><option>사용하다 불편했어요</option><option>오류가 있어요</option><option>좋았던 점을 말하고 싶어요</option><option>그 밖의 이야기</option></select></div>

 </div><p class="privacy-note">적어주신 내용과 연락처는 문의 확인과 답변에만 사용합니다. 자세한 내용은 <a href="../privacy/">개인정보 안내</a>에서 볼 수 있어요.</p><button class="form-submit" type="submit">이야기 보내기</button><p class="form-status" id="formStatus" role="status" aria-live="polite"></p></form>
