<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>단톡방 벌칙전 · 같이놀자</title>
  <meta name="description" content="단체톡에 한 판 올리고, 각자 휴대폰으로 참여해 오늘의 벌칙 주인공을 정해요.">
  <meta property="og:title" content="🎉 단톡방 벌칙전 — 오늘 누가 걸릴까?">
  <meta property="og:description" content="가위바위보, 눈치숫자, 초성 릴레이, 밸런스, 폭탄 돌리기. 단톡방에서 바로 한 판!">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://noljago.co.kr/t/group-room/">
  <link rel="canonical" href="https://noljago.co.kr/t/group-room/">
  <link rel="stylesheet" href="../../assets/party-games.css?v=20260916-party">
  <script src="../../assets/analytics.js?v=20260915-admin-ops"></script>
  <script src="../../assets/kakao-share.js?v=20260916-snake40"></script>
</head>
<body>
<main class="party-wrap">
  <section id="createView" class="party-screen">
    <span class="eyebrow">단체톡에서 바로 시작</span>
    <h1>오늘 벌칙은<br><em>누가 받을까?</em></h1>
    <p class="lead">방 하나를 단체톡에 올리면, 친구들이 각자 휴대폰으로 들어와 함께 해요.</p>
    <div class="party-sheet">
      <label for="hostNickname">내 닉네임</label>
      <input id="hostNickname" maxlength="12" placeholder="단톡에서 쓰는 이름" autocomplete="nickname">
      <fieldset><legend>할 게임</legend><div id="gameChoices" class="game-choices"></div></fieldset>
      <fieldset><legend>이번 벌칙</legend><div id="stakeChoices" class="choice-row">
        <button type="button" data-stake="커피 한 잔" aria-pressed="true">☕ 커피 한 잔</button><button type="button" data-stake="한 잔 마시기">🍺 한 잔 마시기</button><button type="button" data-stake="아이스크림">🍦 아이스크림</button><button type="button" data-stake="custom">✏️ 직접 입력</button>
      </div><input id="customStake" maxlength="40" placeholder="우리만의 벌칙" hidden></fieldset>
      <label for="maxPlayers">방 정원 <small>2~12명, 홀수도 가능해요</small></label>
      <select id="maxPlayers"><option value="2">2명</option><option value="3">3명</option><option value="4" selected>4명</option><option value="5">5명</option><option value="6">6명</option><option value="8">8명</option><option value="10">10명</option><option value="12">12명</option></select>
    </div>
    <button id="createRoom" class="primary" type="button">단톡방 게임 만들기 →</button>
    <p id="createMessage" class="message" role="status"></p>
    <a href="../../?home=play#all" class="back-link">다른 놀이 보기</a>
  </section>

  <section id="joinView" class="party-screen" hidden>
    <span class="eyebrow">단톡방 초대 도착</span><h1><em id="joinGame"></em><br>같이 하자!</h1>
    <p class="lead"><b id="joinCode"></b> 방에 들어갈 이름을 적어주세요.</p>
    <div class="party-sheet"><label for="joinNickname">내 닉네임</label><input id="joinNickname" maxlength="12" placeholder="단톡에서 쓰는 이름" autocomplete="nickname"></div>
    <button id="joinRoom" class="primary" type="button">이 방에 들어가기 →</button><p id="joinMessage" class="message" role="status"></p>
  </section>

  <section id="roomView" class="party-screen" hidden>
    <div class="room-meta"><span id="statusBadge" class="eyebrow"></span><span>방 코드 <b id="roomCode"></b></span></div>
    <h1 id="roomTitle"></h1><p id="roomLead" class="lead"></p>
    <section class="party-sheet members-sheet"><div class="sheet-head"><h2>참가자</h2><span id="memberCount"></span></div><div id="members" class="members"></div></section>
    <div id="shareArea" class="actions"><button id="shareRoom" type="button" class="kakao">💬 단톡방에 게임 올리기</button><button id="copyRoom" type="button" class="secondary">링크 복사</button></div>
    <div id="lobbyArea" class="actions"><button id="readyRoom" class="primary" type="button">나 준비됐어</button><button id="startRoom" class="primary" type="button" hidden>전원 준비 · 시작하기 →</button><p id="lobbyHint" class="hint"></p></div>
    <section id="gameArea" class="game-area" hidden>
      <div id="roundInfo" class="round-info"></div><h2 id="gamePrompt"></h2><p id="gameHelp" class="hint"></p>
      <div id="gameControls" class="game-controls"></div>
      <div id="revealArea" class="reveal" hidden><p id="revealText"></p><div id="moveList" class="move-list"></div><button id="nextRound" type="button" class="primary" hidden>다음 라운드 →</button></div>
    </section>
    <section id="resultArea" class="result" hidden><span>오늘의 벌칙 주인공</span><div class="result-icon">🎉</div><h2 id="resultName"></h2><p id="resultStake"></p><button id="shareResult" type="button" class="kakao">💬 결과를 단톡방에 알리기</button><a class="secondary link-button" href="./">새 단톡방 게임 만들기</a></section>
    <p id="roomMessage" class="message" role="status"></p><a href="../../?home=play#all" class="back-link">다른 놀이 보기</a>
  </section>
</main>
<script src="../../assets/group-room-service.js?v=20260911-1"></script>
<script src="../../assets/party-games.js?v=20260916-party"></script>
</body></html>
