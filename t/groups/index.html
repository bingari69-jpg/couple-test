<style>
  :root{
    --bg:#FFF8E7; --card:#FFFFFF; --line:#F0E4C8; --ink:#1F1B16; --sub:#7A6E5E; --dim:#B5A88F;
    --red:#FF5A5F; --blue:#2D7DFF; --yellow:#FFC94D; --green:#1FA971; --green-s:#E8F7F0;

  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;line-height:1.5;min-height:100vh;padding:var(--sp) var(--sp) 56px;-webkit-user-select:none;user-select:none}
  .wrap{max-width:480px;margin:0 auto}
  .hidden{display:none!important}
  .screen{animation:fade .3s ease}

  .tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--green);background:#fff;border:2px solid var(--green);border-radius:999px;padding:5px 12px;margin-bottom:14px}
  h1{font-size:clamp(28px,8vw,38px);font-weight:900;line-height:1.25;letter-spacing:-.02em;margin-bottom:10px}
  h1 b{color:var(--green)}

  .q{font-size:14px;color:var(--sub);margin:16px 0 8px;display:block;font-weight:600}
  .q em{font-style:normal;color:var(--dim);font-weight:500}
  input[type=text]{width:100%;background:#fff;border:2px solid var(--line);color:var(--ink);border-radius:14px;padding:14px 16px;font:inherit;font-size:17px;font-weight:700}
  input::placeholder{color:var(--dim);font-weight:500}
  input:focus{outline:none;border-color:var(--green)}

  .row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .row .no{flex:none;width:26px;text-align:center;font-size:13px;font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums}

  .del{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--dim);font-size:17px;font-weight:800;cursor:pointer;line-height:1;-webkit-tap-highlight-color:transparent}

  .addrow{width:100%;margin-top:2px;background:transparent;border:2px dashed var(--line);color:var(--sub);border-radius:14px;padding:13px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .addrow:active{transform:scale(.99)}

  .pasterow{display:flex;justify-content:flex-end;margin:-4px 0 8px}
  .pastebtn{background:transparent;border:none;color:var(--green);font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;padding:6px 2px;text-decoration:underline;text-underline-offset:3px;-webkit-tap-highlight-color:transparent}
  .pastebtn.big{width:100%;background:var(--green);color:#fff;border-radius:14px;padding:14px;font-size:16px;text-decoration:none}
  .pastebox{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}

  .pasteact{display:flex;gap:8px;margin-top:6px}

  .lockrow{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--sub)} .lockrow .e{font-size:24px}

  .back ol{list-style:none;counter-reset:t;text-align:left;margin:0 auto;display:inline-block}

  .teenote{margin-top:12px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700;color:var(--sub);text-align:center;line-height:1.55}

  .next{margin-top:22px} .next h3{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:10px}
  .next a{display:block;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 15px;text-decoration:none;color:var(--ink);margin-bottom:8px;font-size:15px;font-weight:700}
  .next a small{display:block;font-weight:500;font-size:12.5px;color:var(--dim);margin-top:2px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-weight:800;font-size:15px;padding:13px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 8px 26px rgba(0,0,0,.25);max-width:90vw;text-align:center}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>

<script>
/* ===== 배포 주소 ===== */
const DEPLOY_BASE = "https://bingari69-jpg.github.io/couple-test/t/groups/";
const isSandbox = () => !(/^https?:$/.test(location.protocol) && location.origin && location.origin!=="null");
const baseUrl   = () => isSandbox() ? DEPLOY_BASE : location.origin + location.pathname;

const MIN_N=5, MAX_N=100, MAX_LEN=12;
const NEXT=[
  {path:"../ladder/",   title:"사다리타기",       desc:"오늘 커피는 누가 쏠까. 단체톡에 던져봐."},
  {path:"../ten/",      title:"10초 맞추기",      desc:"안 보고 10초 세다가 멈추기."},
  {path:"../delivery/", title:"배달 텔레파시",    desc:"내가 뭐 시킬지 맞혀봐. 못 맞히면 네가 사."}
];

/* ===== 해시 · 공통 ===== */
function b64e(s){const b=new TextEncoder().encode(s);let x="";b.forEach(c=>x+=String.fromCharCode(c));return btoa(x).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function b64d(s){s=s.replace(/-/g,"+").replace(/_/g,"/");s+="=".repeat((4-s.length%4)%4);const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u);}
function readHash(){const m=location.hash.match(/^#(c)=(.+)$/);if(!m)return null;
  try{const p=JSON.parse(b64d(m[2]));
    return (p && Array.isArray(p.ns) && typeof p.s==="number" && (p.g===3||p.g===4)
            && p.ns.length>=MIN_N && p.ns.length<=MAX_N) ? p : null;
  }catch(e){return null;}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.add("hidden"));$(id).classList.remove("hidden");window.scrollTo(0,0);}
let tt;function toast(m){const e=$("toast");e.textContent=m;e.style.opacity="1";e.style.transform="translate(-50%,0)";clearTimeout(tt);tt=setTimeout(()=>{e.style.opacity="0";e.style.transform="translate(-50%,20px)";},2400);}
async function copy(url,ok){let d=false;try{await navigator.clipboard.writeText(url);d=true;}catch(e){const ta=document.createElement("textarea");ta.value=url;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{d=document.execCommand("copy");}catch(e2){}ta.remove();}toast(d?ok:"링크를 길게 눌러 복사해줘");}
function share(o,fb){ if(window.kakaoShare) kakaoShare(o,fb); else fb(); }
const track=(e,p)=>{try{window.track&&window.track(e,p);}catch(x){}};

/* ===== 시드 난수 (mulberry32) =====
   Math.random() 은 링크를 만드는 순간 시드를 뽑을 때만 쓴다.
   조편성은 오직 이 시드로만 만들어지므로, 같은 링크면 누가 언제 열어도 같은 조가 나온다. */
function mulberry32(a){
  return function(){
    a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15), 1|a);
    t=(t+Math.imul(t^(t>>>7), 61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
/* 인원 n 을 조 크기 g 기준으로 나눈다.
   조 수는 ceil(n/g), 그 안에서 최대한 고르게 — 4인 기준 11명이면 4·4·3. */
function planOf(n, g){
  const k=Math.max(1, Math.ceil(n/g));
  const base=Math.floor(n/k), rem=n%k;
  return Array.from({length:k},(_,i)=>base+(i<rem?1:0));
}
/* 시드로 섞고 앞에서부터 조 크기대로 자른다. 조편성은 저장하지 않고 언제나 여기서 다시 만든다. */
function groupsOf(p){
  const n=p.ns.length;
  const idx=Array.from({length:n},(_,i)=>i);
  const rnd=mulberry32(p.s>>>0);
  for(let i=n-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=idx[i];idx[i]=idx[j];idx[j]=t; }
  const sizes=planOf(n, p.g);
  const out=[]; let at=0;
  sizes.forEach(sz=>{ out.push(idx.slice(at,at+sz).map(i=>p.ns[i])); at+=sz; });
  return out;
}
/* 조가 8개 이하면 하나씩, 넘으면 "4명×21 · 3명×2" 로 줄여 쓴다 */
function planText(sizes){
  const k=sizes.length;
  if(k<=8) return `${k}조: ${sizes.map(s=>s+"명").join("·")}`;
  const runs=[];
  sizes.forEach(s=>{ const last=runs[runs.length-1];
    if(last && last[0]===s) last[1]++; else runs.push([s,1]); });
  return `${k}조: ${runs.map(([s,c])=>c>1?`${s}명×${c}`:`${s}명`).join(" · ")}`;
}

/* ===== 상태 ===== */
/* revealed: 이미 뒤집은 조. 스포일러를 막기 위한 것으로 조편성 자체와는 무관하다. */
const state={names:["","","","",""],g:4,made:null,revealed:new Set()};
let madeUrl="";
let view=null;   // {p, groups}

/* ===== 만들기 화면 ===== */
function renderPlan(){
  const sizes=planOf(state.names.length, state.g);
  $("plan").innerHTML=`${planText(sizes)}<small>${state.names.length}명을 ${state.g}인조 기준으로 나눈 결과예요</small>`;
}
function renderMake(){
  const n=state.names.length;
  const nb=$("nameRows"); nb.innerHTML="";
  state.names.forEach((v,i)=>{
    const row=document.createElement("div"); row.className="row";
    const no=document.createElement("div"); no.className="no"; no.textContent=(i+1);
    const inp=document.createElement("input"); inp.type="text"; inp.maxLength=MAX_LEN;
    inp.value=v; inp.placeholder="참가자"+(i+1);
    inp.setAttribute("aria-label",(i+1)+"번째 참가자 이름");
    inp.oninput=e=>{state.names[i]=e.target.value;};
    /* 첫 칸에 명단을 통째로 붙여넣으면 같은 규칙으로 나눠 담는다 */
    if(i===0) inp.addEventListener("paste",e=>{
      const t=(e.clipboardData||window.clipboardData||{getData:()=>""}).getData("text");
      if(window.looksLikeRoster && looksLikeRoster(t)){ e.preventDefault(); applyRoster(t,"input"); }
    });
    row.appendChild(no); row.appendChild(inp);
    if(n>MIN_N){
      const del=document.createElement("button"); del.type="button"; del.className="del"; del.textContent="✕";
      del.setAttribute("aria-label",(i+1)+"번째 참가자 삭제");
      del.onclick=()=>{ state.names.splice(i,1); renderMake(); };
      row.appendChild(del);
    }
    nb.appendChild(row);
  });
  $("addName").classList.toggle("hidden", n>=MAX_N);
  /* 15명이 넘으면 입력칸을 스크롤 영역으로 접고, 인원 수를 위에 고정 표시 */
  const many = n>15;
  $("nameRows").classList.toggle("rowsbox", many);
  $("cntBar").classList.toggle("hidden", !many);
  $("cntBar").textContent = "현재 "+n+"명";
  $("pasteToggle").classList.toggle("big", n>=15);
  $("size4").setAttribute("aria-pressed", state.g===4);
  $("size3").setAttribute("aria-pressed", state.g===3);
  renderPlan();
}
/* 붙여넣은 명단을 참가자 칸에 담는다.
   상한을 넘으면 잘라내고, 하한보다 적으면 빈 칸을 남겨 둔다. */
function applyRoster(text, src){
  if(!window.parseRoster){ toast("붙여넣기를 쓸 수 없어요"); return false; }
  const r=parseRoster(text,{max:MAX_N,maxLen:6});
  if(!r.names.length){ toast("이름을 찾지 못했어요"); return false; }
  const filled=state.names.some(v=>(v||"").trim());
  if(filled && !confirm("지금 입력된 이름을 덮어씁니다. 계속할까요?")) return false;
  const ns=r.names.slice();
  while(ns.length<MIN_N) ns.push("");          // 하한 미만이면 빈 칸 유지
  state.names=ns;
  renderMake();
  $("pasteBox").classList.add("hidden");
  $("pasteText").value="";
  track("roster_paste",{n:r.names.length, src:src||"box"});
  const msg=[];
  if(r.dup)  msg.push(`중복 ${r.dup}명은 제외했어요`);
  if(r.over) msg.push(`${MAX_N}명까지만 넣을 수 있어 나머지는 제외했어요`);
  toast(msg.length ? msg.join(" · ") : `${r.names.length}명 넣었어요`);
  return true;
}
$("pasteToggle").onclick=()=>{
  const open=$("pasteBox").classList.toggle("hidden")===false;
  if(open) setTimeout(()=>$("pasteText").focus(),60);
};
$("pasteCancel").onclick=()=>{ $("pasteBox").classList.add("hidden"); };
$("pasteApply").onclick=()=>applyRoster($("pasteText").value,"box");

$("addName").onclick=()=>{
  if(state.names.length>=MAX_N) return;
  state.names.push(""); renderMake();
  const rows=$("nameRows").querySelectorAll("input");
  const last=rows[rows.length-1]; if(last) last.focus();
};
$("size4").onclick=()=>{ state.g=4; renderMake(); };
$("size3").onclick=()=>{ state.g=3; renderMake(); };

$("makeLink").onclick=()=>{
  const ns=state.names.map((v,i)=>(v||"").trim().slice(0,MAX_LEN) || ("참가자"+(i+1)));
  if(ns.length<MIN_N){ toast("참가자는 5명부터야"); return; }
  const seed=Math.floor(Math.random()*0xFFFFFFFF);      // 무작위는 여기서 딱 한 번
  const p={v:1, ns, g:state.g, s:seed};
  madeUrl=baseUrl()+"#c="+b64e(JSON.stringify(p));
  state.made=p;
  $("linkbox").textContent=madeUrl;
  $("sandboxNote").classList.toggle("hidden",!isSandbox());
  const sizes=planOf(ns.length, state.g);
  $("shareLead").textContent=`${ns.length}명이 ${planText(sizes)} 로 나뉘었어요. 링크를 받은 사람이 카드를 눌러 확인해요.`;
  show("s-share");
};
$("copyBtn").onclick=()=>copy(madeUrl,"복사됐어. 톡방에 붙여넣어");
$("kakaoBtn").onclick=()=>share({
  url:madeUrl, btn:"내 조 확인하기",
  img:"https://bingari69-jpg.github.io/couple-test/og/og-groups-sq.png",
  title:"⛳ 조편성 뽑기 — 이번 라운딩 누구랑 칠까?",
  desc:`${state.made?state.made.ns.length:0}명 조편성이 나왔어요. 내 조 확인하기`
}, ()=>copy(madeUrl,"카톡 공유를 못 열어 링크를 복사했어"));
/* 공유 화면에서 결과로 넘어가는 길은 두지 않는다.
   뽑은 사람이 결과를 먼저 보고 마음에 안 들면 다시 뽑는 걸 막기 위해,
   뽑은 사람도 톡방에 보낸 링크를 열어서 확인한다. */

/* ===== 열람 화면 ===== */
function openGroups(p){
  view={p, groups:groupsOf(p)};
  state.revealed=new Set();
  const sizes=view.groups.map(g=>g.length);
  $("playLead").textContent=`${p.ns.length}명이 ${planText(sizes)} 로 나뉘었어. 카드는 아직 뒷면이야.`;
  renderDecks();
  $("result").innerHTML=""; $("result").classList.add("hidden");
  $("showAll").classList.remove("hidden");
  $("nextList").innerHTML=NEXT.map(x=>`<a href="${x.path}">${esc(x.title)}<small>${esc(x.desc)}</small></a>`).join("");
  show("s-play");
}
/* 뒷면 내용은 공개된 조에만 넣는다.
   카드를 뒤집기 전에는 명단이 DOM 에 아예 없어서 개발자도구로도 미리 볼 수 없다. */
function backHtml(gi){
  const mem=view.groups[gi];
  return `<div class="gno">${gi+1}조 · ${mem.length}명</div>`+
         `<ol>${mem.map(nm=>`<li>${esc(nm)}</li>`).join("")}</ol>`;
}
function renderDecks(){
  const box=$("decks"); box.innerHTML="";
  box.classList.toggle("two", view.groups.length>6);   // 조가 많으면 2열 고정
  view.groups.forEach((mem,gi)=>{
    const open=state.revealed.has(gi);
    const b=document.createElement("button");
    b.type="button"; b.className="gcard"+(open?" open":""); b.dataset.g=gi;
    b.setAttribute("aria-label",(gi+1)+"조 카드"+(open?" (공개됨)":" (눌러서 공개)"));
    b.innerHTML=
      `<div class="gin">
        <div class="face front"><div class="qm">?</div><div class="gno">${gi+1}조</div><div class="cnt">${mem.length}명</div></div>
        <div class="face back">${open?backHtml(gi):""}</div>
      </div>`;
    b.onclick=()=>flip(gi);
    box.appendChild(b);
  });
}
function noteLine(){
  const box=$("result");
  if(!state.revealed.size){ box.classList.add("hidden"); box.innerHTML=""; return; }
  box.className="";
  box.innerHTML=`<div class="teenote">${state.revealed.size}개 조 공개 · <b>조 안 순서로 티샷 순서까지 정해드렸어요</b></div>`;
  box.classList.remove("hidden");
}
function flip(gi){
  if(state.revealed.has(gi)) return;
  state.revealed.add(gi);
  track("groups_pick",{g:gi+1, of:view.groups.length});
  const b=$("decks").querySelector(`.gcard[data-g="${gi}"]`);
  if(b){
    b.querySelector(".back").innerHTML=backHtml(gi);   // 이때 처음 명단이 들어간다
    b.classList.add("open");
    b.setAttribute("aria-label",(gi+1)+"조 카드 (공개됨)");
  }
  setTimeout(noteLine, 260);
  if(state.revealed.size===view.groups.length) $("showAll").classList.add("hidden");
}
/* 카드가 화면 안에 있는지 — 밖에 있으면 뒤집기 애니메이션을 돌리지 않는다(폰 성능) */
function onScreen(el){
  if(!el.getBoundingClientRect) return true;
  const r=el.getBoundingClientRect();
  const h=window.innerHeight||0;
  return r.bottom>0 && r.top<h;
}
$("showAll").onclick=()=>{
  track("groups_all",{of:view.groups.length});
  const cards=[...$("decks").querySelectorAll(".gcard")];
  cards.forEach((c,gi)=>{
    if(state.revealed.has(gi)) return;
    state.revealed.add(gi);
    if(!onScreen(c)) c.classList.add("noanim");     // 보이지 않는 카드는 즉시 전환
    c.querySelector(".back").innerHTML=backHtml(gi);
    c.classList.add("open");
    c.setAttribute("aria-label",(gi+1)+"조 카드 (공개됨)");
  });
  noteLine();
  $("showAll").classList.add("hidden");
};
$("copyLink").onclick=()=>copy(baseUrl()+location.hash,"복사됐어. 톡방에 붙여넣어");
$("kakaoShareBtn").onclick=()=>{
  const url=baseUrl()+location.hash;
  share({url, btn:"내 조 확인하기",
    img:"https://bingari69-jpg.github.io/couple-test/og/og-groups-sq.png",
    title:"⛳ 조편성 뽑기 — 이번 라운딩 누구랑 칠까?",
    desc:`${view.p.ns.length}명 조편성이 나왔어요. 내 조 확인하기`},
    ()=>copy(url,"카톡 공유를 못 열어 링크를 복사했어"));
};
$("again").onclick=()=>{ location.hash=""; location.reload(); };

/* ===== 진입 ===== */
(function(){
  const p=readHash();
  if(p){ openGroups(p); return; }
  renderMake(); show("s-make");
})();
</script>
</body>
