<style>
  :root{

  input::placeholder{color:var(--dim);font-weight:500}

  /* 참가자 · 결과 입력 줄 */
  .row{display:flex;align-items:center;gap:8px;margin-bottom:8px}

  .pastebox{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

<script>
/* ===== 배포 주소 ===== */
const DEPLOY_BASE = "https://bingari69-jpg.github.io/couple-test/t/ladder/";
const isSandbox = () => !(/^https?:$/.test(location.protocol) && location.origin && location.origin!=="null");
const baseUrl   = () => isSandbox() ? DEPLOY_BASE : location.origin + location.pathname;

const MIN_N=2, MAX_N=10, MAX_LEN=12;
const NEXT=[
  {path:"../rps/",      title:"가위바위보 도전장", desc:"내가 먼저 낸다. 네가 이길 수 있는지 골라봐."},
  {path:"../delivery/", title:"배달 텔레파시",    desc:"내가 뭐 시킬지 맞혀봐. 못 맞히면 네가 사."},
  {path:"../ten/",      title:"10초 맞추기",      desc:"안 보고 10초 세다가 멈추기."}
];

/* ===== 해시 · 공통 ===== */
function b64e(s){const b=new TextEncoder().encode(s);let x="";b.forEach(c=>x+=String.fromCharCode(c));return btoa(x).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function b64d(s){s=s.replace(/-/g,"+").replace(/_/g,"/");s+="=".repeat((4-s.length%4)%4);const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u);}
function readHash(){const m=location.hash.match(/^#(c)=(.+)$/);if(!m)return null;
  try{const p=JSON.parse(b64d(m[2]));
    return (p && Array.isArray(p.ns) && Array.isArray(p.rs) && typeof p.s==="number"
            && p.ns.length===p.rs.length && p.ns.length>=MIN_N && p.ns.length<=MAX_N) ? p : null;
  }catch(e){return null;}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.add("hidden"));$(id).classList.remove("hidden");window.scrollTo(0,0);}
let tt;function toast(m){const e=$("toast");e.textContent=m;e.style.opacity="1";e.style.transform="translate(-50%,0)";clearTimeout(tt);tt=setTimeout(()=>{e.style.opacity="0";e.style.transform="translate(-50%,20px)";},2400);}
async function copy(url,ok){let d=false;try{await navigator.clipboard.writeText(url);d=true;}catch(e){const ta=document.createElement("textarea");ta.value=url;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{d=document.execCommand("copy");}catch(e2){}ta.remove();}toast(d?ok:"링크를 길게 눌러 복사해줘");}
function share(o,fb){ if(window.kakaoShare) kakaoShare(o,fb); else fb(); }
const track=(e,p)=>{try{window.track&&window.track(e,p);}catch(x){}};

/* ===== 시드 난수 (mulberry32) =====
   Math.random() 은 링크를 만드는 순간 시드를 뽑을 때만 쓴다.
   사다리 모양과 매핑은 오직 이 시드로만 만들어지므로,
   같은 링크면 누가 언제 열어도 같은 사다리·같은 결과가 나온다. */
function mulberry32(a){
  return function(){
    a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15), 1|a);
    t=(t+Math.imul(t^(t>>>7), 61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
/* 시드로 가로선을 놓는다.
   - 가로선은 이웃한 세로줄 사이에만 (i ↔ i+1)
   - 같은 층에서 한 세로줄에 두 개가 붙지 않게 (사다리 규칙)

   그냥 무작위로 가로선을 뿌리면 사다리가 공정하지 않다.
   토큰은 한 층에 한 칸씩만 옆으로 움직여서, 층이 적으면 멀리 있는 칸까지 못 간다
   (10명이면 1번이 1번 결과에 걸릴 확률이 10%가 아니라 24%까지 치우친다).
   그래서 먼저 시드로 "고른 순열"을 뽑고, 그걸 홀짝 교환 정렬망으로 그대로 재현한다.
   n층이면 어떤 순열이든 만들 수 있으므로, 층을 늘리지 않고도 정확히 1/n 이 된다.
   장식용 무작위 가로선을 앞뒤로 더 얹어도, 고른 순열과 합성한 결과는 여전히 고르다. */
function buildRungs(n, seed){
  const rnd=mulberry32(seed>>>0);

  /* 1) 고른 순열 뽑기 (피셔–예이츠) — perm[i] = i번 참가자의 도착 칸 */
  const perm=Array.from({length:n},(_,i)=>i);
  for(let i=n-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=perm[i];perm[i]=perm[j];perm[j]=t; }

  /* 2) 그 순열을 홀짝 교환 정렬망으로 재현.
        한 층은 같은 홀짝의 칸만 쓰므로 이웃끼리 겹칠 일이 없다. */
  const layers=[];
  const A=perm.slice();
  for(let round=0; round<n; round++){
    const layer=[];
    for(let i=round%2; i<n-1; i+=2){
      if(A[i]>A[i+1]){ const t=A[i];A[i]=A[i+1];A[i+1]=t; layer.push(i); }
    }
    layers.push(layer);
  }

  /* 3) 앞뒤에 장식용 무작위 층을 섞어 사다리답게 보이게 한다 */
  const decor=()=>{
    const layer=[]; const used=new Array(n).fill(false);
    for(let i=0;i<n-1;i++){
      if(used[i]) continue;
      if(rnd()<0.45){ layer.push(i); used[i]=true; used[i+1]=true; }
    }
    return layer;
  };
  const pad=Math.max(4,n), head=Math.floor(pad/2);
  const all=[];
  for(let k=0;k<head;k++) all.push(decor());
  layers.forEach(l=>all.push(l));
  for(let k=0;k<pad-head;k++) all.push(decor());

  const rungs=[];
  all.forEach((layer,row)=>layer.forEach(i=>rungs.push({row,i})));
  rungs.sort((a,b)=>a.row-b.row || a.i-b.i);
  return {rows:all.length, rungs};
}
/* 사다리를 실제로 타고 내려가 도착 칸을 구한다.
   매핑은 따로 저장하지 않고 언제나 이 함수로 다시 계산한다. */
function walk(start, n, rows, rungs){
  let col=start;
  const path=[{row:0,col}];
  for(let r=0;r<rows;r++){
    const left =rungs.find(g=>g.row===r && g.i===col);     // 오른쪽으로 건너가는 가로선
    const right=rungs.find(g=>g.row===r && g.i===col-1);   // 왼쪽으로 건너가는 가로선
    if(left||right){
      path.push({row:r+0.5,col});          // 가로선 높이까지 내려오고
      col = left ? col+1 : col-1;          // 옆으로 건너간 다음
      path.push({row:r+0.5,col});          // 거기서 다시 아래로
    }
    path.push({row:r+1,col});
  }
  return {end:col, path};
}
function mappingOf(n, rows, rungs){
  return Array.from({length:n},(_,i)=>walk(i,n,rows,rungs).end);
}

/* ===== 상태 ===== */
/* revealed: 이미 공개된 결과 칸. rungsShown: 가로선을 그렸는지.
   둘 다 스포일러를 막기 위한 것으로, 사다리 자체(시드로 만든 모양)와는 무관하다. */
const state={names:["",""],prizes:[],made:null,picked:new Set(),animating:false,
  revealed:new Set(),rungsShown:false};
let madeUrl="";

/* ===== 만들기 화면 ===== */
const defPrize = i => i===0 ? "당첨 🎉" : "꽝";
function syncPrizes(){
  const n=state.names.length;
  while(state.prizes.length<n) state.prizes.push(defPrize(state.prizes.length));
  state.prizes.length=n;
}
function renderMake(){
  syncPrizes();
  const n=state.names.length;

  const nb=$("nameRows"); nb.innerHTML="";
  state.names.forEach((v,i)=>{
    const row=document.createElement("div"); row.className="row";
    const no=document.createElement("div"); no.className="no"; no.textContent=(i+1);
    const inp=document.createElement("input"); inp.type="text"; inp.maxLength=MAX_LEN;
    inp.value=v; inp.placeholder="참가자"+(i+1);
    inp.setAttribute("aria-label",(i+1)+"번째 참가자 이름");
    inp.oninput=e=>{state.names[i]=e.target.value;};
    /* 첫 칸에 명단을 통째로 붙여넣으면 같은 규칙으로 나눠 담는다 */
    if(i===0) inp.addEventListener("paste",e=>{
      const t=(e.clipboardData||window.clipboardData||{getData:()=>""}).getData("text");
      if(window.looksLikeRoster && looksLikeRoster(t)){ e.preventDefault(); applyRoster(t,"input"); }
    });
    row.appendChild(no); row.appendChild(inp);
    if(n>MIN_N){
      const del=document.createElement("button"); del.type="button"; del.className="del"; del.textContent="✕";
      del.setAttribute("aria-label",(i+1)+"번째 참가자 삭제");
      del.onclick=()=>{ state.names.splice(i,1); state.prizes.splice(i,1); renderMake(); };
      row.appendChild(del);
    }
    nb.appendChild(row);
  });
  $("addName").classList.toggle("hidden", n>=MAX_N);

  const pb=$("prizeRows"); pb.innerHTML="";
  state.prizes.forEach((v,i)=>{
    const row=document.createElement("div"); row.className="row";
    const no=document.createElement("div"); no.className="no"; no.textContent=(i+1);
    const inp=document.createElement("input"); inp.type="text"; inp.maxLength=MAX_LEN;
    inp.value=v; inp.placeholder="결과"+(i+1);
    inp.setAttribute("aria-label",(i+1)+"번째 결과");
    inp.oninput=e=>{state.prizes[i]=e.target.value;};
    row.appendChild(no); row.appendChild(inp);
    pb.appendChild(row);
  });
}
/* 붙여넣은 명단을 참가자 칸에 담는다.
   상한을 넘으면 잘라내고, 하한보다 적으면 빈 칸을 남겨 둔다. */
function applyRoster(text, src){
  if(!window.parseRoster){ toast("붙여넣기를 쓸 수 없어요"); return false; }
  const r=parseRoster(text,{max:MAX_N,maxLen:6});
  if(!r.names.length){ toast("이름을 찾지 못했어요"); return false; }
  const filled=state.names.some(v=>(v||"").trim());
  if(filled && !confirm("지금 입력된 이름을 덮어씁니다. 계속할까요?")) return false;
  const ns=r.names.slice();
  while(ns.length<MIN_N) ns.push("");          // 하한 미만이면 빈 칸 유지
  state.names=ns;
  renderMake();
  $("pasteBox").classList.add("hidden");
  $("pasteText").value="";
  track("roster_paste",{n:r.names.length, src:src||"box"});
  const msg=[];
  if(r.skipped) msg.push(`명단이 아닌 줄 ${r.skipped}개는 건너뛰었어요`);
  if(r.dup)     msg.push(`중복 ${r.dup}명은 제외했어요`);
  if(r.over)    msg.push(`${MAX_N}명까지만 넣을 수 있어 나머지는 제외했어요`);
  toast(msg.length ? msg.join(" · ") : `${r.names.length}명 넣었어요`);
  return true;
}
$("pasteToggle").onclick=()=>{
  const box=$("pasteBox"), open=box.classList.toggle("hidden")===false;
  if(open) setTimeout(()=>$("pasteText").focus(),60);
};
$("pasteCancel").onclick=()=>{ $("pasteBox").classList.add("hidden"); };
$("pasteApply").onclick=()=>applyRoster($("pasteText").value,"box");

$("addName").onclick=()=>{
  if(state.names.length>=MAX_N) return;
  state.names.push(""); renderMake();
  const rows=$("nameRows").querySelectorAll("input");
  const last=rows[rows.length-1]; if(last) last.focus();
};
$("makeLink").onclick=()=>{
  const ns=state.names.map((v,i)=>(v||"").trim().slice(0,MAX_LEN) || ("참가자"+(i+1)));
  const rs=state.prizes.map((v,i)=>(v||"").trim().slice(0,MAX_LEN) || ("결과"+(i+1)));
  if(ns.length<MIN_N){ toast("참가자는 2명부터야"); return; }
  const seed=Math.floor(Math.random()*0xFFFFFFFF);      // 무작위는 여기서 딱 한 번
  const p={v:1, ns, rs, s:seed};
  madeUrl=baseUrl()+"#c="+b64e(JSON.stringify(p));
  state.made=p;
  $("linkbox").textContent=madeUrl;
  $("sandboxNote").classList.toggle("hidden",!isSandbox());
  $("shareLead").textContent=`${ns.length}명이 참가해요. 링크를 받은 사람이 자기 이름을 누르면 결과가 나와요.`;
  show("s-share");
};
$("copyBtn").onclick=()=>copy(madeUrl,"복사됐어. 단체톡에 붙여넣어");
$("kakaoBtn").onclick=()=>share({
  url:madeUrl, btn:"내 결과 확인하기",
  img:"https://bingari69-jpg.github.io/couple-test/og/og-ladder-sq.png",
  title:"🪜 사다리타기 — 오늘의 운명은?",
  desc:`${state.made?state.made.ns.length:0}명이 참가해요. 내 결과 확인하기`
}, ()=>copy(madeUrl,"카톡 공유를 못 열어 링크를 복사했어"));
/* 공유 화면에서 결과로 넘어가는 길은 두지 않는다.
   주최자가 결과를 먼저 보고 마음에 안 들면 다시 만드는 걸 막기 위해,
   주최자도 톡방에 보낸 링크를 열어서 확인한다. */

/* ===== 열람 화면 ===== */
let view=null;   // {p, n, rows, rungs, map, geom}
function openLadder(p){
  const n=p.ns.length;
  const {rows,rungs}=buildRungs(n, p.s);
  view={p, n, rows, rungs, map:mappingOf(n,rows,rungs)};
  state.picked=new Set(); state.revealed=new Set(); state.rungsShown=false;
  $("playLead").textContent=`${n}명이 참가했어. 결과 칸은 아직 ? 야. 자기 이름을 눌러야 열려.`;
  renderPicks(); drawLadder();
  $("result").innerHTML=""; $("result").classList.add("hidden");
  $("allBox").innerHTML=""; $("allBox").classList.add("hidden");
  $("showAll").classList.remove("hidden");
  $("nextList").innerHTML=NEXT.map(x=>`<a href="${x.path}">${esc(x.title)}<small>${esc(x.desc)}</small></a>`).join("");
  show("s-play");
}
function renderPicks(){
  const box=$("picks"); box.innerHTML="";
  view.p.ns.forEach((nm,i)=>{
    const b=document.createElement("button"); b.type="button";
    b.className="pick"+(state.picked.has(i)?" done":"");
    b.textContent=nm; b.dataset.i=i;
    b.onclick=()=>pick(i);
    box.appendChild(b);
  });
}

/* 사다리 그리기.
   viewBox 폭은 480으로 고정하고 세로줄을 그 안에 나눠 놓는다.
   (참가자가 2명이든 10명이든 화면에서 비슷한 크기로 보이게) */
const GEO={w:480, padX:30, top:34, bottom:30};
function geom(){
  const n=view.n, rows=view.rows;
  const colGap=(GEO.w-GEO.padX*2)/Math.max(1,n-1);
  const rowH=Math.max(15, Math.min(34, 300/rows));
  const h=GEO.top+GEO.bottom+rowH*rows;
  return {w:GEO.w, h, colGap, rowH, x:i=>GEO.padX+colGap*i, y:r=>GEO.top+rowH*r};
}
const cut=(s,n)=>s.length>n ? s.slice(0,n)+"…" : s;
/* 스포일러 방지:
   - 이름을 누르기 전에는 가로선을 아예 그리지 않는다. 미리 눈으로 따라갈 수 없게.
   - 아래 결과 칸은 "?" 로 가려두고, 누군가 도착한 칸만 하나씩 공개한다(공개는 누적).
   opt: {start, end, d}  d 가 있으면 경로를 애니메이션 없이 그대로 그린다. */
function drawLadder(opt){
  opt=opt||{};
  const g=geom(); view.geom=g;
  const n=view.n;
  const lab=Math.max(3, Math.floor(28/n)+2);   // 칸이 좁을수록 라벨을 짧게
  let s=`<svg id="svg" role="img" aria-label="사다리" viewBox="0 0 ${g.w} ${g.h}" xmlns="http://www.w3.org/2000/svg">`;
  for(let i=0;i<n;i++) s+=`<line class="rail" x1="${g.x(i)}" y1="${g.y(0)}" x2="${g.x(i)}" y2="${g.y(view.rows)}"/>`;
  if(state.rungsShown){
    view.rungs.forEach(r=>{
      s+=`<line class="rung" x1="${g.x(r.i)}" y1="${g.y(r.row+0.5)}" x2="${g.x(r.i+1)}" y2="${g.y(r.row+0.5)}"/>`;
    });
  }
  /* 위 = 참가자, 아래 = 결과 */
  view.p.ns.forEach((nm,i)=>{
    const on = opt.start===i;
    s+=`<text class="capL${on?" hit":""}" x="${g.x(i)}" y="${g.y(0)-12}" text-anchor="middle">${esc(cut(nm,lab))}</text>`;
  });
  view.p.rs.forEach((rs,i)=>{
    const open = state.revealed.has(i);
    const hit  = open && opt.end===i;
    const txt  = open ? cut(rs,lab) : "?";
    s+=`<text class="capL${hit?" hit":(open?"":" dim")}" x="${g.x(i)}" y="${g.y(view.rows)+18}" text-anchor="middle">${esc(txt)}</text>`;
  });
  s+=`<path id="tracePath" class="trace${opt.d?"":" hidden"}" d="${opt.d||""}"/>`;
  s+=`</svg>`;
  $("svg").outerHTML=s;
}
function pathD(path){
  const g=view.geom;
  return path.map((pt,k)=>(k?"L":"M")+g.x(pt.col)+" "+g.y(pt.row)).join(" ");
}

function pick(i){
  if(state.animating) return;
  const w=walk(i, view.n, view.rows, view.rungs);
  state.animating=true;
  [...$("picks").children].forEach(b=>{ b.disabled=true; b.classList.toggle("on", +b.dataset.i===i); });
  $("result").classList.add("hidden"); $("result").innerHTML="";
  track("ladder_pick",{who:i+1, of:view.n});

  state.rungsShown=true;                 // 이제부터 가로선을 보여준다
  drawLadder({start:i});                 // 도착 칸은 아직 "?" 인 채로
  const el=document.getElementById("tracePath");
  el.classList.remove("hidden");
  el.setAttribute("d", pathD(w.path));
  const len=el.getTotalLength();
  /* 줄이 길수록 조금 더 오래, 1.5~2.5초 */
  const dur=Math.min(2500, Math.max(1500, 900+view.rows*90));
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){ el.style.strokeDasharray=""; el.style.strokeDashoffset=""; finish(i,w); return; }
  el.style.strokeDasharray=len; el.style.strokeDashoffset=len;
  el.style.transition="none";
  void el.getBoundingClientRect();
  el.style.transition=`stroke-dashoffset ${dur}ms cubic-bezier(.45,.05,.3,1)`;
  el.style.strokeDashoffset="0";
  setTimeout(()=>finish(i,w), dur+60);
}
function finish(i,w){
  state.animating=false;
  state.picked.add(i);
  state.revealed.add(w.end);             // 도착한 칸만 공개 (누적)
  drawLadder({start:i, end:w.end, d:pathD(w.path)});   // 경로는 그대로 둔 채 라벨만 갱신
  const nm=view.p.ns[i], rs=view.p.rs[w.end];
  const box=$("result");
  box.className="";
  box.innerHTML=`<div class="outcome"><div class="who">${esc(nm)}</div>
    <div class="what${w.end===0?" win":""}">${esc(rs)}</div></div>`;
  box.classList.remove("hidden");
  [...$("picks").children].forEach(b=>{
    b.disabled=false;
    const j=+b.dataset.i;
    b.classList.toggle("done", state.picked.has(j) && j!==i);
    b.classList.toggle("on", j===i);
  });
  box.scrollIntoView({block:"nearest", behavior:"smooth"});
}
$("showAll").onclick=()=>{
  track("ladder_all",{of:view.n});
  state.rungsShown=true;
  view.p.rs.forEach((_,i)=>state.revealed.add(i));
  drawLadder();
  const rowsHtml=view.p.ns.map((nm,i)=>{
    const e=view.map[i];
    return `<tr class="${e===0?"win":""}"><td>${esc(nm)}</td><td class="r">${esc(view.p.rs[e])}</td></tr>`;
  }).join("");
  $("allBox").innerHTML=`<table class="all"><thead><tr><th>참가자</th><th>결과</th></tr></thead><tbody>${rowsHtml}</tbody></table>`;
  $("allBox").classList.remove("hidden");
  $("showAll").classList.add("hidden");
  $("allBox").scrollIntoView({block:"nearest", behavior:"smooth"});
};
$("copyLink").onclick=()=>copy(baseUrl()+location.hash,"복사됐어. 단체톡에 붙여넣어");
$("kakaoShareBtn").onclick=()=>{
  const url=baseUrl()+location.hash;
  share({url, btn:"내 결과 확인하기",
    img:"https://bingari69-jpg.github.io/couple-test/og/og-ladder-sq.png",
    title:"🪜 사다리타기 — 오늘의 운명은?",
    desc:`${view.n}명이 참가해요. 내 결과 확인하기`},
    ()=>copy(url,"카톡 공유를 못 열어 링크를 복사했어"));
};
$("again").onclick=()=>{ location.hash=""; location.reload(); };

/* ===== 진입 ===== */
(function(){
  const p=readHash();
  if(p){ openLadder(p); return; }
  renderMake(); show("s-make");
})();
</script>
