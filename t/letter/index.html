<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기념일 편지</title>

<meta property="og:type" content="website">
<meta property="og:title" content="편지가 도착했어요">
<meta property="og:description" content="누군가 당신에게 편지를 남겼습니다. 열어보세요.">
<meta property="og:image" content="https://bingari69-jpg.github.io/couple-test/og/og-letter.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://bingari69-jpg.github.io/couple-test/t/letter/">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="../../assets/analytics.js"></script>
<script src="../../assets/kakao-share.js"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --night:#151831; --night-2:#1E2244; --night-3:#2A2F58;
    --paper:#FBF7EF; --paper-2:#F3EDE1; --paper-line:rgba(38,42,69,.12);
    --ink:#2A2A38; --ink-soft:#5C6080; --ink-faint:#9A927F;
    --mark:#E4899E; --moon:#F0DFA8;
    --serif:'Gowun Batang','Nanum Myeongjo',serif;
    --sp:clamp(16px,4vw,24px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--night);color:#FAF6EE;
    font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
    line-height:1.6;min-height:100vh;padding:var(--sp) var(--sp) 60px;
    background-image:
      radial-gradient(ellipse 70% 45% at 50% 8%,rgba(240,223,168,.09),transparent 68%),
      radial-gradient(ellipse 60% 40% at 50% 95%,rgba(228,137,158,.07),transparent 70%);
  }
  .wrap{max-width:560px;margin:0 auto}
  .hidden{display:none!important}

  .counter{padding:24px 0 4px;text-align:center}
  .grid100{display:grid;grid-template-columns:repeat(20,1fr);gap:clamp(3px,1.1vw,5px);max-width:420px;margin:0 auto 18px}
  .cell{aspect-ratio:1;border-radius:50%;background:var(--mark);opacity:0;transform:scale(.3);animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
  .cell.last{background:var(--moon);box-shadow:0 0 0 3px rgba(240,223,168,.22)}
  @keyframes pop{to{opacity:1;transform:scale(1)}}
  .count-num{font-family:'IBM Plex Mono',monospace;font-size:clamp(38px,11vw,54px);font-weight:500;color:var(--moon);line-height:1}
  .count-num.word{font-family:var(--serif);font-size:clamp(30px,9vw,42px)}
  .count-label{font-size:13px;color:var(--ink-soft);margin-top:8px;letter-spacing:.06em}

  section{margin-top:26px}
  .q{font-size:13px;color:#9AA0C4;margin-bottom:10px;display:block}
  .q em{font-style:normal;color:#666C96;font-size:12px}
  input[type=text],input[type=number]{width:100%;background:var(--night-2);border:1px solid var(--night-3);color:#FAF6EE;border-radius:12px;padding:13px 14px;font:inherit;font-size:16px}
  input::placeholder{color:#5A5F86}
  input:focus{outline:2px solid var(--moon);outline-offset:1px;border-color:transparent}
  .row2{display:flex;gap:10px}
  .row2>div{flex:1;min-width:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--night-2);border:1px solid var(--night-3);color:#B6BBDC;border-radius:999px;padding:9px 15px;font:inherit;font-size:14px;cursor:pointer;transition:background .15s,color .15s}
  .chip[aria-pressed=true]{background:var(--moon);color:var(--night);border-color:var(--moon);font-weight:600}
  .chip:focus-visible{outline:2px solid var(--moon);outline-offset:2px}

  /* 모드 스위치 */
  .modebar{display:flex;gap:0;background:var(--night-2);border:1px solid var(--night-3);border-radius:14px;padding:4px;margin-top:6px}
  .modebar button{flex:1;background:transparent;border:none;color:#8C92BC;font:inherit;font-size:14.5px;padding:11px;border-radius:10px;cursor:pointer;transition:background .15s,color .15s}
  .modebar button[aria-pressed=true]{background:var(--moon);color:var(--night);font-weight:600}
  .modebar button:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
  .modenote{font-size:12.5px;color:#666C96;margin-top:9px;line-height:1.7}

  /* 편지지 */
  .letter-wrap{margin-top:28px}
  .letter{background:var(--paper);color:var(--ink);border-radius:5px;padding:28px 20px 24px;box-shadow:0 18px 44px rgba(0,0,0,.42);font-family:var(--serif);font-size:17px;line-height:2;position:relative}
  .letter::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(90deg,var(--mark) 0 14px,transparent 14px 28px);border-radius:5px 5px 0 0;opacity:.5}
  /* 본문 — textarea 하나 (줄 단위 편집 UI 제거) */
  .freewrite{width:100%;background:transparent;border:none;outline:none;resize:none;
    font-family:var(--serif);font-size:17.5px;line-height:2.1;color:var(--ink);
    min-height:240px;padding:2px}
  .freewrite::placeholder{color:#C3BBA8}
  .charcount{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-faint);margin-top:10px}
  .charcount.over{color:#C4566B}   /* 460자부터 */
  .hint{font-size:12.5px;color:#666C96;margin-top:12px;text-align:center;line-height:1.7}

  .actions{margin-top:22px;display:flex;flex-direction:column;gap:10px}
  .btn{width:100%;border:none;border-radius:14px;padding:16px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:transform .1s,filter .15s}
  .btn:active{transform:scale(.985)}
  .btn:focus-visible{outline:2px solid var(--moon);outline-offset:3px}
  .btn-main{background:var(--moon);color:var(--night)}
  .btn-sub{background:transparent;color:#9AA0C4;border:1px solid var(--night-3);font-weight:500}
  .btn-sub:hover{border-color:#4A5090;color:#B6BBDC}
  .btn-ghost{background:transparent;color:#999;font-size:14px;border:none;font-weight:500;padding:12px}
  .linkbox{margin-top:12px;background:var(--night-2);border:1px solid var(--night-3);border-radius:12px;padding:13px 14px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8C92BC;word-break:break-all;line-height:1.6;max-height:88px;overflow:auto}
  .homelink{display:block;text-align:center;font-size:12.5px;color:#666C96;text-decoration:none;margin-top:22px}
  .homelink:hover{color:#B6BBDC}

  /* 수신 */
  .previewbar{
    width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--night-2);border:1px solid var(--night-3);border-radius:12px;
    padding:12px 15px;margin-bottom:18px;cursor:pointer;font:inherit;
    color:#8C92BC;font-size:13px;text-align:left;transition:border-color .15s,color .15s;
  }
  .previewbar b{color:var(--moon);font-size:13.5px;font-weight:600;flex:none}
  .previewbar:hover{border-color:var(--moon)}
  .previewbar:focus-visible{outline:2px solid var(--moon);outline-offset:2px}

  #view-read{min-height:86vh;display:flex;flex-direction:column;justify-content:center}
  .envelope{background:linear-gradient(#FBF7EF,#F4EDE0);border-radius:8px;padding:60px 26px 54px;text-align:center;cursor:pointer;position:relative;overflow:hidden;border:none;width:100%;font:inherit;color:var(--ink);box-shadow:0 22px 50px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.6)}
  .envelope::after{content:"";position:absolute;left:0;right:0;top:0;height:54%;background:linear-gradient(#F5EEE1,#EBE1CE);clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .8s cubic-bezier(.5,0,.2,1);transform-origin:top}
  .envelope.opening::after{transform:rotateX(180deg)}
  .seal{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#EE9CAF,#D9647F);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:18px;color:#fff;position:relative;z-index:2;box-shadow:0 4px 12px rgba(180,80,105,.4)}
  .seal.word{font-family:var(--serif);font-size:16px}
  .env-title{font-family:var(--serif);font-size:20px;position:relative;z-index:2;color:#3A3527}
  .env-sub{font-size:13px;color:#9A927F;margin-top:10px;position:relative;z-index:2}

  .sheet{background:var(--paper);color:var(--ink);border-radius:3px;padding:34px 26px 30px;position:relative;box-shadow:0 26px 60px rgba(0,0,0,.5);animation:lift .9s cubic-bezier(.2,.9,.3,1) both}
  @keyframes lift{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}
  .sheet::before{content:"";position:absolute;inset:11px;border:1px solid var(--paper-line);border-radius:2px;pointer-events:none}
  .sheet-top{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:14px;margin-bottom:22px;border-bottom:1px solid var(--paper-line);position:relative;z-index:1;gap:10px}
  .to{font-family:var(--serif);font-size:17px}
  .to i,.from i{font-family:'IBM Plex Mono',monospace;font-style:normal;font-size:11px;color:var(--ink-faint);letter-spacing:.14em;margin-right:7px}
  .days{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);letter-spacing:.12em;flex:none}
  .body{position:relative;z-index:1}
  .rl{font-family:var(--serif);font-size:17.5px;line-height:2.15;margin-bottom:16px;opacity:0;transform:translateY(9px);animation:rise 1.25s ease forwards}
  .rl.blank{height:.6em;margin-bottom:0}   /* 본문의 빈 줄 = 문단 사이 간격 */
  @keyframes rise{to{opacity:1;transform:none}}
  .sign{margin-top:26px;padding-top:16px;border-top:1px solid var(--paper-line);display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1}
  .date{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-faint)}
  .from{font-family:var(--serif);font-size:16px;text-align:right}
  .dots{display:flex;justify-content:center;gap:5px;margin-top:24px}
  .dots i{width:4px;height:4px;border-radius:50%;background:rgba(228,137,158,.45)}
  .dots i:last-child{background:var(--moon)}
  .read-foot{margin-top:14px;text-align:center;font-size:12.5px;color:#7C82AA}
  .read-actions{margin-top:30px;display:flex;flex-direction:column;gap:9px}
  .read-actions .btn{padding:14px;font-size:15px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--moon);color:var(--night);font-weight:600;font-size:14.5px;padding:13px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 8px 26px rgba(0,0,0,.4);max-width:90vw;text-align:center}

  @media (prefers-reduced-motion:reduce){
    .cell,.rl,.sheet{animation:none;opacity:1;transform:none}
    .envelope::after{transition:none}
    *{transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<!-- ============ 작성 ============ -->
<div class="wrap" id="view-write">
  <div class="counter">
    <div class="grid100" id="grid" aria-hidden="true"></div>
    <div class="count-num" id="countNum">100</div>
    <div class="count-label" id="countLabel">일째 되는 날</div>
  </div>

  <section>
    <div class="q">어떻게 쓸까요?</div>
    <div class="modebar" role="group" aria-label="작성 방식">
      <button type="button" id="modeT" aria-pressed="true">문장 골라 쓰기</button>
      <button type="button" id="modeW" aria-pressed="false">직접 쓰기</button>
    </div>
    <p class="modenote" id="modeNote">몇 가지만 고르면 편지가 채워집니다. 그다음 자유롭게 고쳐 쓰세요.</p>
  </section>

  <section class="tmode">
    <div class="q" id="relLabel">누구에게 보내나요?</div>
    <div class="chips" role="group" aria-labelledby="relLabel" id="relChips"></div>
  </section>

  <section class="tmode">
    <div class="q" id="sitLabel">요즘 어떤 사이인가요?</div>
    <div class="chips" role="group" aria-labelledby="sitLabel" id="sitChips"></div>
  </section>

  <section>
    <div class="q" id="kindLabel">무슨 날인가요?</div>
    <div class="chips" role="group" aria-labelledby="kindLabel" id="kindChips"></div>
    <div id="numWrap" style="margin-top:10px">
      <input type="number" id="numIn" min="1" max="9999" placeholder="숫자" value="100">
    </div>
  </section>

  <section>
    <div class="row2">
      <div>
        <label class="q" for="nameIn">받는 사람</label>
        <input type="text" id="nameIn" placeholder="이름" maxlength="14" value="자기야">
      </div>
      <div>
        <label class="q" for="fromIn">보내는 사람 <em>· 선택</em></label>
        <input type="text" id="fromIn" placeholder="이름" maxlength="14">
      </div>
    </div>
  </section>

  <section class="tmode">
    <div class="q" id="toneLabel">어떤 느낌으로 쓸까요?</div>
    <div class="chips" role="group" aria-labelledby="toneLabel" id="toneChips"></div>
  </section>

  <section class="tmode">
    <label class="q" for="momentIn">고마웠던 순간이 있다면 <em>· 안 쓰셔도 됩니다</em></label>
    <input type="text" id="momentIn" placeholder="예: 내가 아플 때 죽 사다준 거" maxlength="40">
  </section>

  <div class="letter-wrap">
    <div class="letter">
      <textarea class="freewrite" id="freewrite" maxlength="480"
        placeholder="여기에 편지를 쓰세요.&#10;&#10;엔터로 줄을 나눌 수 있어요."></textarea>
      <div class="charcount" id="charcount">0 / 480</div>
    </div>
    <p class="hint" id="letterHint">고른 문장이 여기에 채워집니다. 그대로 보내도 되고, 자유롭게 고쳐 써도 됩니다</p>
  </div>

  <div class="actions">
    <button class="btn btn-main" id="makeLink">편지 링크 만들기</button>
    <div class="linkbox hidden" id="linkbox"></div>
    <button class="btn btn-main hidden" id="kakaoBtn" style="background:#FEE500;color:#191600">💬 카톡으로 편지 보내기</button>
    <button class="btn btn-ghost hidden" id="copyLink">링크만 복사</button>
    <button class="btn btn-sub hidden" id="previewBtn">받는 사람 화면 미리보기</button>
    <p class="hint hidden" id="sandboxNote">지금은 미리보기 창 안이라 링크가 열리지 않습니다. 배포한 뒤 확인해 주세요.</p>
    <button class="btn btn-sub tmode" id="allBtn">전체 다시 뽑기</button>
  </div>
  <a class="homelink" href="../../">다른 테스트 보기 →</a>
</div>

<!-- ============ 수신 ============ -->
<div class="wrap hidden" id="view-read">
  <button class="previewbar hidden" id="previewBar" type="button">
    <span>미리보기 중입니다</span><b>← 편집으로 돌아가기</b>
  </button>
  <button class="envelope" id="envelope">
    <div class="seal" id="seal">100</div>
    <div class="env-title" id="envTitle">편지가 도착했어요</div>
    <div class="env-sub">눌러서 열어보세요</div>
  </button>
  <div class="hidden" id="opened">
    <div class="sheet">
      <div class="sheet-top">
        <div class="to"><i>TO.</i><span id="toName"></span></div>
        <div class="days" id="badge"></div>
      </div>
      <div class="body" id="readBody"></div>
      <div class="sign">
        <div class="date" id="letterDate"></div>
        <div class="from hidden" id="fromWrap"><i>FROM.</i><span id="fromName"></span></div>
      </div>
    </div>
    <div class="dots" aria-hidden="true"></div>
    <p class="read-foot" id="readFoot"></p>
    <div class="read-actions">
      <button class="btn btn-main hidden" id="backEdit">← 편집으로 돌아가기</button>
      <button class="btn btn-main" id="writeBack">나도 편지 쓰기</button>
      <a class="btn btn-sub" href="../../" style="display:block;text-align:center;text-decoration:none;line-height:1.4">다른 테스트 보기</a>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== 배포 주소 ===== */
const DEPLOY_BASE = "https://bingari69-jpg.github.io/couple-test/t/letter/";
const isSandbox = () => !(/^https?:$/.test(location.protocol) && location.origin && location.origin!=="null");
const baseUrl   = () => isSandbox() ? DEPLOY_BASE : location.origin + location.pathname;
const BANK_VERSION = 3;
const MAX_FREE = 480;   // 본문 전체 최대 (textarea maxlength 와 같아야 함)
const WARN_AT  = 460;   // 이 글자 수부터 카운터를 경고색으로 (한도 20자 전)

/* ===== 기념일 ===== */
const KINDS = [
  {id:"day",   label:"100일",     num:100, ask:"며칠째인가요?"},
  {id:"year",  label:"주년",      num:1,   ask:"몇 주년인가요?"},
  {id:"wed",   label:"결혼기념일", num:1,   ask:"몇 주년인가요?"},
  {id:"bday",  label:"생일",      num:0},
  {id:"plain", label:"그냥",      num:0}
];
/* ===== 관계 ===== */
const RELS = [
  {id:"lover",   label:"연인",      reg:"반", def:"자기야", ph:"자기야 / 이름",
   sits:["장거리야","자주 다퉈","조용한 편이야","매일 붙어있어","이제 막 편해졌어"]},
  {id:"spouse",  label:"배우자",    reg:"반", def:"여보",   ph:"여보 / 이름",
   sits:["오래됐어","요즘 서로 바빠","아이 키우는 중이야","티격태격해"]},
  {id:"friend",  label:"친구",      reg:"반", def:"",      ph:"이름",
   sits:["오래된 사이야","요즘 통 못 봤어","자주 보는 사이야","힘들 때 곁에 있어줬어"]},
  {id:"parent",  label:"부모님",    reg:"존", def:"엄마",   ph:"엄마 / 아빠",
   sits:["표현을 잘 안 해요","멀리 살아요","자주 뵙는 편이에요","최근에 많이 도움받았어요"]},
  {id:"sibling", label:"형제·자매", reg:"반", def:"",      ph:"이름 또는 호칭",
   sits:["티격태격해","멀리 살아","자주 봐","은근히 챙겨줘"]},
  {id:"child",   label:"자녀",      reg:"반", def:"",      ph:"이름",
   sits:["많이 컸어","요즘 대화가 줄었어","떨어져 지내","늘 곁에 있어"]}
];
const TONES = ["담백","다정","웃김","진지"];

const OPEN = {
  반:{
    anniv:{
      담백:["{n}, 오늘 {L}이야.","{n}, 벌써 {L}이네.","{n}, 오늘로 딱 {L}이다."],
      다정:["{n}, 오늘 우리 {L}이야.","{n}, {L}이라는 게 오늘이더라.","{n}, 우리가 {L}을 같이 지나왔어."],
      웃김:["{n} {L} 축하해 ㅋㅋ","{n}, {L}이래. 나도 방금 알았어.","{n}, 오늘 {L}이다. 다들 박수."],
      진지:["{n}, 오늘로 {L}이야.","{n}, {L}이라는 시간이 지났네.","{n}, 오늘 {L}이라 하루 종일 생각이 많았어."]
    },

/* text: 편지 본문(textarea 의 값). 이것이 유일한 본문 원본이다.
   dirty: 사용자가 본문을 직접 건드렸는지. true 가 되면 템플릿이 덮어쓰지 않는다
          (단 "전체 다시 뽑기" 는 명시적 재생성이므로 예외). */
const state={mode:"t",kind:0,num:100,rel:0,sit:3,tone:1,
  idx:[0,0,0,0],text:"",dirty:false,name:"자기야",nameTouched:false,from:"",moment:""};
const K=()=>KINDS[state.kind], R=()=>RELS[state.rel];

/* ===== 관계별로 고를 수 있는 기념일 =====
   여기 없는 날은 칩을 아예 내보내지 않는다.
   결혼기념일은 배우자만, 100일·주년은 연인·친구만.
   (이미 뿌려진 옛 링크는 이 제한과 무관하게 그대로 열린다) */
const KIND_BY_REL = {
  lover:   ["day","year","bday","plain"],
  spouse:  ["year","wed","bday","plain"],
  friend:  ["day","year","bday","plain"],
  parent:  ["bday","plain"],
  sibling: ["bday","plain"],
  child:   ["bday","plain"]
};
/* [{k:기념일, i:KINDS 안에서의 원래 순번}] — 칩을 걸러 그려도 순번이 어긋나지 않게 */
function allowedKinds(){
  const ok = KIND_BY_REL[R().id] || ["bday","plain"];
  return KINDS.map((k,i)=>({k,i})).filter(o=>ok.includes(o.k.id));
}
const pick=(a,i)=>a[i%a.length];

function labelOf(p){
  const k=KINDS[p.k]||KINDS[0];
  if(k.id==="day")  return (p.num||100)+"일";
  if(k.id==="year") return (p.num||1)+"주년";
  if(k.id==="wed")  return (p.num>1)? p.num+"주년" : "결혼기념일";
  return "";
}
function banksOf(p){
  const rl=RELS[p.rel]||RELS[0], rg=rl.reg, tn=TONES[p.t]||TONES[0], m=(p.m||"").trim();
  const grp=(KINDS[p.k]||KINDS[0]).id;
  const og = grp==="bday" ? "bday" : (grp==="plain" ? "plain" : "anniv");
  const sits=SIT[rl.id];
  const bodyBank  = m ? MOMENT[rg][tn] : ((BODY_OVR[rl.id]||BODY[rg])[tn]);
  const closeBank = (CLOSE_OVR[rl.id]||CLOSE[rg])[tn];
  const base=[
    OPEN[rg][og][tn],
    sits[Math.min(p.s||0, sits.length-1)],
    bodyBank,
    closeBank
  ];
  for(let i=0;i<(p.x||0);i++) base.push([""]);   // 추가한 빈 줄
  return base;
}
/* 호칭은 편지 상단 TO. 에만 쓰고, 본문 첫 줄에서는 뺀다 */
function fill(t,p,m){
  return String(t)
    .replace(/^\{n\}\s*,?\s*/,"")          // 맨 앞 호칭 제거
    .replace(/\{n\}/g, p.n||"")            // 그 외 위치는 이름으로
    .replace("{m}", m)
    .replace("{L}", labelOf(p));
}
/* 링크의 본문 → 문단 배열.
   새 형식(p.w = 본문 문자열 하나): 줄바꿈을 그대로 문단으로 살린다.
     빈 줄은 문단 사이 간격으로 남기되, 연속된 빈 줄은 하나로 줄이고 앞뒤 빈 줄은 버린다.
   옛 형식(p.i = 문장 인덱스 배열): 예전 그대로 뱅크에서 문장을 조립한다. */
function linesOf(p){
  if(p.w!=null){
    const raw=String(p.w).replace(/\r\n?/g,"\n").split("\n").map(s=>s.trim());
    while(raw.length && !raw[0]) raw.shift();
    while(raw.length && !raw[raw.length-1]) raw.pop();
    const out=[]; let blank=0;
    for(const s of raw){ if(s){ blank=0; out.push(s); } else if(++blank<=1) out.push(""); }
    return out;
  }
  const m=(p.m||"").trim(), e=p.e||{};
  return banksOf(p).map((b,i)=>{
    if(e[i]!=null && String(e[i]).trim()) return String(e[i]);
    return fill(pick(b,(p.i||[])[i]||0), p, m);
  }).filter(s=>s.trim());
}
/* 고른 조건으로 만든 템플릿 본문. 줄바꿈으로 이어 붙인 한 덩어리 글. */
function composeText(){
  const p={v:BANK_VERSION,k:state.kind,n:state.name||"이름",rel:state.rel,
    s:state.sit,t:state.tone,i:state.idx.slice(),num:state.num};
  if(state.moment.trim()) p.m=state.moment.trim();
  const m=(p.m||"").trim();
  return banksOf(p).map((b,i)=>fill(pick(b,(p.i||[])[i]||0), p, m))
    .map(s=>s.trim()).filter(Boolean).join("\n").slice(0,MAX_FREE);
}
function payload(){
  /* 새 형식: 본문은 언제나 문자열 하나(p.w)로 싣는다.
     p.rel 은 맺음말(footOf)이 관계별 존댓말을 고르는 데 쓰이므로 함께 싣는다. */
  const p={v:BANK_VERSION,k:state.kind,n:state.name||"이름",d:today(),rel:state.rel};
  if(K().num) p.num=state.num;
  if(state.from.trim()) p.f=state.from.trim();
  p.w=state.text.slice(0,MAX_FREE);
  return p;
}

/* ===== 해시 ===== */
function b64e(s){const b=new TextEncoder().encode(s);let x="";b.forEach(c=>x+=String.fromCharCode(c));
  return btoa(x).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function b64d(s){s=s.replace(/-/g,"+").replace(/_/g,"/");s+="=".repeat((4-s.length%4)%4);
  const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  return new TextDecoder().decode(u);}
function today(){const d=new Date();
  return d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0");}
function readHash(){
  const h=location.hash; if(!h.startsWith("#l="))return null;
  try{const p=JSON.parse(b64d(h.slice(3)));
    return (p && (p.w!=null || Array.isArray(p.i))) ? p : null;}catch(e){return null;}
}

/* ===== 헤더 ===== */
function renderHeader(){
  const k=K(), grid=document.getElementById("grid");
  const num=document.getElementById("countNum"), lab=document.getElementById("countLabel");
  grid.innerHTML="";
  if(k.id==="day" && state.num<=200){
    const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
    const n=Math.max(1,Math.min(200,state.num));
    for(let i=0;i<n;i++){
      const c=document.createElement("div");
      c.className="cell"+(i===n-1?" last":"");
      c.style.animationDelay=(reduce?0:i*8)+"ms";
      grid.appendChild(c);
    }
  }
  num.classList.toggle("word", !k.num);
  if(k.id==="day"){ num.textContent=state.num; lab.textContent="일째 되는 날"; }
  else if(k.id==="year"||k.id==="wed"){ num.textContent=state.num; lab.textContent=k.id==="wed"?"번째 결혼기념일":"주년"; }
  else if(k.id==="bday"){ num.textContent="생일"; lab.textContent="오늘은 당신의 날"; }
  else { num.textContent="편지"; lab.textContent="특별한 날은 아니지만"; }
}

/* ===== 작성 ===== */
let madeUrl="";


function hideLink(){
  ["linkbox","copyLink","kakaoBtn","previewBtn","sandboxNote"].forEach(id=>document.getElementById(id).classList.add("hidden"));
  document.getElementById("makeLink").textContent="편지 링크 만들기";
  madeUrl="";
}
/* 카운터 갱신 + textarea 높이 맞추기 */
function syncCount(){
  const n=state.text.length, c=document.getElementById("charcount");
  c.textContent=n+" / "+MAX_FREE;
  c.classList.toggle("over", n>=WARN_AT);
  const FREE=document.getElementById("freewrite");
  FREE.style.height="auto"; FREE.style.height=Math.max(240,FREE.scrollHeight)+"px";
}
/* 아직 손대지 않은 본문이면 고른 조건으로 다시 채운다. 손댔으면 건드리지 않는다. */
function syncText(force){
  if(state.mode==="t" && (force || !state.dirty)){
    state.text=composeText();
    document.getElementById("freewrite").value=state.text;
    if(force) state.dirty=false;
  }
  syncCount();
}
function render(){
  renderHeader();
  syncText(false);
  hideLink();
}
function applyMode(){
  const t = state.mode==="t";
  document.getElementById("modeT").setAttribute("aria-pressed", t);
  document.getElementById("modeW").setAttribute("aria-pressed", !t);
  document.querySelectorAll(".tmode").forEach(el=>el.classList.toggle("hidden", !t));
  document.getElementById("modeNote").textContent = t
    ? "몇 가지만 고르면 편지가 채워집니다. 그다음 자유롭게 고쳐 쓰세요."
    : "빈 편지지에 처음부터 직접 씁니다. "+MAX_FREE+"자까지 쓸 수 있어요.";
  document.getElementById("letterHint").textContent = t
    ? "고른 문장이 여기에 채워집니다. 그대로 보내도 되고, 자유롭게 고쳐 써도 됩니다"
    : "엔터로 줄을 나누면, 받는 사람 화면에서도 그대로 나뉘어 보입니다";
  render();
}
/* 문장 골라 쓰기로 오면 고른 조건으로 다시 채우고, 직접 쓰기로 가면 빈 편지지에서 시작한다 */
document.getElementById("modeT").onclick=()=>{state.mode="t";state.dirty=false;applyMode();syncText(true);hideLink();};
document.getElementById("modeW").onclick=()=>{
  state.mode="w"; state.dirty=true; state.text="";
  document.getElementById("freewrite").value="";
  applyMode(); syncCount();
  setTimeout(()=>document.getElementById("freewrite").focus(),80);};

function chipRow(boxId,items,getLabel,current,onPick){
  const box=document.getElementById(boxId); box.innerHTML="";
  items.forEach((v,i)=>{
    const b=document.createElement("button");
    b.className="chip"; b.type="button"; b.textContent=getLabel(v,i);
    b.setAttribute("aria-pressed", current===i);
    b.onclick=()=>onPick(i);
    box.appendChild(b);
  });
}
function renderKinds(){
  const list=allowedKinds();
  chipRow("kindChips",list,o=>o.k.label,list.findIndex(o=>o.i===state.kind),j=>{
    const i=list[j].i;
    state.kind=i;
    const k=KINDS[i];
    if(k.num) state.num=k.num;
    document.getElementById("numIn").value=state.num;
    if(k.num) document.getElementById("numIn").placeholder=k.ask;
    document.getElementById("numWrap").classList.toggle("hidden", !k.num);
    state.idx=state.idx.map(()=>Math.floor(Math.random()*3));
    renderKinds(); render();
  });
  document.getElementById("numWrap").classList.toggle("hidden", !K().num);
}
/* 관계를 바꿔서 지금 고른 날이 그 관계에 없어지면, 고를 수 있는 첫 날로 옮긴다 */
function ensureKind(){
  const list=allowedKinds();
  if(!list.some(o=>o.i===state.kind)){
    const i=list[0].i, k=KINDS[i];
    state.kind=i;
    if(k.num) state.num=k.num;
    document.getElementById("numIn").value=state.num;
    if(k.num) document.getElementById("numIn").placeholder=k.ask;
  }
  renderKinds();
}
function renderRels(){
  chipRow("relChips",RELS,r=>r.label,state.rel,i=>{
    state.rel=i; state.sit=0;
    applyRelName();
    state.idx=state.idx.map(()=>Math.floor(Math.random()*3));
    renderRels(); renderSits(); ensureKind(); render();
  });
}
function applyRelName(){
  const r=R(), inp=document.getElementById("nameIn");
  inp.placeholder=r.ph;
  if(!state.nameTouched){            // 사용자가 직접 안 고쳤을 때만 바꿈
    state.name=r.def;
    inp.value=r.def;
  }
}
function renderSits(){
  chipRow("sitChips",R().sits,s=>s,state.sit,i=>{state.sit=i;renderSits();render();});
}
function renderTones(){
  chipRow("toneChips",TONES,t=>t,state.tone,i=>{
    state.tone=i;
    state.idx=state.idx.map(()=>Math.floor(Math.random()*3));
    renderTones(); render();
  });
}
renderKinds(); renderRels(); renderSits(); renderTones(); applyRelName();

/* 본문 직접 쓰기 — maxlength 로 480자를 막고, 붙여넣기 등으로 넘어오면 잘라낸다.
   한 글자라도 손대면 dirty 가 되어 템플릿이 덮어쓰지 않는다. */
const FREE=document.getElementById("freewrite");
FREE.addEventListener("input",()=>{
  if(FREE.value.length>MAX_FREE) FREE.value=FREE.value.slice(0,MAX_FREE);
  state.text=FREE.value;
  state.dirty=true;
  syncCount();
  hideLink();
});

/* 공통 입력 */
document.getElementById("numIn").oninput=e=>{
  const v=parseInt(e.target.value,10);
  state.num=isNaN(v)?1:Math.max(1,Math.min(9999,v)); render();
};
document.getElementById("nameIn").oninput=e=>{
  state.name=e.target.value;
  state.nameTouched=!!e.target.value.trim();
  render();
};
document.getElementById("fromIn").oninput=e=>{state.from=e.target.value;hideLink();};
document.getElementById("momentIn").oninput=e=>{state.moment=e.target.value;render();};
/* 명시적 재생성. 직접 고쳐 쓴 본문도 이때는 새 문장으로 덮어쓴다. */
document.getElementById("allBtn").onclick=()=>{
  const had=state.dirty;
  state.idx=state.idx.map(()=>Math.floor(Math.random()*3));
  renderHeader(); syncText(true); hideLink();
  toast(had ? "새로 뽑았어요. 직접 쓴 내용은 새 문장으로 바뀌었습니다" : "새로 뽑았어요");
};

document.getElementById("makeLink").onclick=()=>{
  if(!state.text.trim()){toast("편지 내용을 먼저 써주세요");document.getElementById("freewrite").focus();return;}
  madeUrl=baseUrl()+"#l="+b64e(JSON.stringify(payload()));
  const box=document.getElementById("linkbox");
  box.textContent=madeUrl;
  document.getElementById("copyLink").classList.remove("hidden");
  document.getElementById("kakaoBtn").classList.remove("hidden");
  document.getElementById("kakaoBtn").onclick=()=>kakaoShare({url:madeUrl,btn:"편지 열어보기",img:"https://bingari69-jpg.github.io/couple-test/og/og-letter-sq.png",
    title:`${state.name||"당신"}에게 편지가 도착했어요`, desc: state.from.trim() ? `${state.from.trim()}이(가) 보낸 편지입니다. 봉투를 눌러 열어보세요.` : "누군가 편지를 남겼습니다. 봉투를 눌러 열어보세요."},
    ()=>document.getElementById("copyLink").click());
  document.getElementById("previewBtn").classList.remove("hidden");
  document.getElementById("makeLink").textContent="편지 링크 다시 만들기";
  document.getElementById("sandboxNote").classList.toggle("hidden",!isSandbox());
  toast("링크가 만들어졌어요");
};
document.getElementById("copyLink").onclick=async()=>{
  let ok=false;
  try{await navigator.clipboard.writeText(madeUrl);ok=true;}
  catch(e){
    const ta=document.createElement("textarea");
    ta.value=madeUrl;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{ok=document.execCommand("copy");}catch(e2){}
    ta.remove();
  }
  toast(ok?"복사됐어요. 카톡에 붙여넣으세요":"링크를 길게 눌러 복사해 주세요");
};
document.getElementById("previewBtn").onclick=()=>showRead(payload(), true);

let tt; function toast(m){const el=document.getElementById("toast");
  el.textContent=m;el.style.opacity="1";el.style.transform="translate(-50%,0)";
  clearTimeout(tt);tt=setTimeout(()=>{el.style.opacity="0";el.style.transform="translate(-50%,20px)";},2400);}

/* ===== 수신 ===== */
function badgeOf(p){
  const k=KINDS[p.k]||KINDS[0];
  if(k.id==="day")  return (p.num||100)+" DAYS";
  if(k.id==="year") return "YEAR "+(p.num||1);
  if(k.id==="wed")  return "ANNIVERSARY";
  if(k.id==="bday") return "BIRTHDAY";
  return "LETTER";
}
function sealOf(p){
  const k=KINDS[p.k]||KINDS[0];
  if(k.id==="day"||k.id==="year"||k.id==="wed") return String(p.num||1);
  if(k.id==="bday") return "생일";
  return "편지";
}
function footOf(p){
  const k=KINDS[p.k]||KINDS[0];
  const rg=(RELS[p.rel]||RELS[0]).reg;
  if(k.id==="bday") return (p.rel===3) ? "생신 축하드려요" : "생일 축하해요";
  if(k.id==="plain") return "잘 지내요";
  return labelOf(p)+" 축하해요";
}
function showRead(p, preview){
  document.getElementById("view-write").classList.add("hidden");
  document.getElementById("view-read").classList.remove("hidden");
  document.getElementById("previewBar").classList.toggle("hidden", !preview);
  document.getElementById("backEdit").classList.toggle("hidden", !preview);
  document.getElementById("writeBack").classList.toggle("hidden", !!preview);
  document.getElementById("envTitle").textContent=(p.n? p.n+"에게 ":"")+"편지가 도착했어요";
  const seal=document.getElementById("seal");
  const st=sealOf(p); seal.textContent=st;
  seal.classList.toggle("word", isNaN(Number(st)));
  window.scrollTo(0,0);

  const env=document.getElementById("envelope");
  env.classList.remove("opening","hidden");
  document.getElementById("opened").classList.add("hidden");
  document.getElementById("fromWrap").classList.add("hidden");
  env.onclick=()=>{
    env.classList.add("opening");
    setTimeout(()=>{
      env.classList.add("hidden");
      document.getElementById("toName").textContent=p.n||"이름";
      document.getElementById("badge").textContent=badgeOf(p);
      document.getElementById("letterDate").textContent=p.d||today();
      document.getElementById("readFoot").textContent=footOf(p);
      if(p.f){
        document.getElementById("fromName").textContent=p.f;
        document.getElementById("fromWrap").classList.remove("hidden");
      }
      const box=document.getElementById("readBody"); box.innerHTML="";
      const ls=linesOf(p);
      ls.forEach((t,i)=>{
        const d=document.createElement("p"); d.className=t?"rl":"rl blank"; d.textContent=t;
        /* 한 줄씩 떠오르는 간격. 줄이 많을수록 좁히되 너무 빨라지지는 않게 */
        d.style.animationDelay=(700+i*Math.max(320, 700-ls.length*24))+"ms";
        box.appendChild(d);
      });
      const dots=document.querySelector(".dots");
      dots.innerHTML=""; for(let i=0;i<10;i++)dots.appendChild(document.createElement("i"));
      document.getElementById("opened").classList.remove("hidden");
    },820);
  };
}
function backToEdit(){
  document.getElementById("view-read").classList.add("hidden");
  document.getElementById("view-write").classList.remove("hidden");
  window.scrollTo(0,0);
  // 링크는 그대로 두고, 미리보기 버튼만 다시 보여줌
  if(madeUrl){
    document.getElementById("copyLink").classList.remove("hidden");
    document.getElementById("kakaoBtn").classList.remove("hidden");
    document.getElementById("previewBtn").classList.remove("hidden");
  }
}
document.getElementById("backEdit").onclick=backToEdit;
document.getElementById("previewBar").onclick=backToEdit;
document.getElementById("writeBack").onclick=()=>{location.hash="";location.reload();};

document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && !document.getElementById("previewBar").classList.contains("hidden")) backToEdit();
});

/* ===== 진입 ===== */
const p0=readHash();
if(p0) showRead(p0, false); else applyMode();
</script>
