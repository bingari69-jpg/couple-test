<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100일 편지</title>

<meta property="og:type" content="website">
<meta property="og:title" content="편지가 도착했어요">
<meta property="og:description" content="100일을 기념해 누군가 편지를 남겼습니다. 열어보세요.">
<meta property="og:image" content="https://bingari69-jpg.github.io/couple-test/og-image.png">
<meta property="og:url" content="https://bingari69-jpg.github.io/couple-test/t/letter100/">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --night:#151831; --night-2:#1E2244; --night-3:#2A2F58;
    --paper:#FBF7EF; --paper-2:#F3EDE1; --paper-line:rgba(38,42,69,.12);
    --ink:#2A2A38; --ink-soft:#5C6080; --ink-faint:#9A927F;
    --mark:#E4899E; --moon:#F0DFA8;
    --serif:'Gowun Batang','Nanum Myeongjo',serif;
    --sp:clamp(16px,4vw,24px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--night);color:#FAF6EE;
    font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
    line-height:1.6;min-height:100vh;padding:var(--sp) var(--sp) 60px;
    background-image:
      radial-gradient(ellipse 70% 45% at 50% 8%,rgba(240,223,168,.09),transparent 68%),
      radial-gradient(ellipse 60% 40% at 50% 95%,rgba(228,137,158,.07),transparent 70%);
  }
  .wrap{max-width:560px;margin:0 auto}
  .hidden{display:none!important}
  .mono{font-family:'IBM Plex Mono',monospace}

  /* ================= 작성 화면 ================= */
  .counter{padding:26px 0 4px;text-align:center}
  .grid100{display:grid;grid-template-columns:repeat(20,1fr);gap:clamp(3px,1.1vw,5px);max-width:420px;margin:0 auto 18px}
  .cell{aspect-ratio:1;border-radius:50%;background:var(--mark);opacity:0;transform:scale(.3);animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
  .cell.last{background:var(--moon);box-shadow:0 0 0 3px rgba(240,223,168,.22)}
  @keyframes pop{to{opacity:1;transform:scale(1)}}
  .count-num{font-family:'IBM Plex Mono',monospace;font-size:clamp(38px,11vw,54px);font-weight:500;color:var(--moon);line-height:1}
  .count-label{font-size:13px;color:var(--ink-soft);margin-top:8px;letter-spacing:.06em}

  section{margin-top:28px}
  .q{font-size:13px;color:#9AA0C4;margin-bottom:10px}
  .q em{font-style:normal;color:#666C96;font-size:12px}
  input[type=text]{width:100%;background:var(--night-2);border:1px solid var(--night-3);color:#FAF6EE;border-radius:12px;padding:13px 14px;font:inherit;font-size:16px}
  input[type=text]::placeholder{color:#5A5F86}
  input[type=text]:focus{outline:2px solid var(--moon);outline-offset:1px;border-color:transparent}
  .row2{display:flex;gap:10px}
  .row2>div{flex:1;min-width:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--night-2);border:1px solid var(--night-3);color:#B6BBDC;border-radius:999px;padding:9px 15px;font:inherit;font-size:14px;cursor:pointer;transition:background .15s,color .15s}
  .chip[aria-pressed=true]{background:var(--moon);color:var(--night);border-color:var(--moon);font-weight:600}
  .chip:focus-visible{outline:2px solid var(--moon);outline-offset:2px}

  .letter-wrap{margin-top:32px}
  .letter{background:var(--paper);color:var(--ink);border-radius:5px;padding:28px 20px 24px;box-shadow:0 18px 44px rgba(0,0,0,.42);font-family:var(--serif);font-size:17px;line-height:2;position:relative}
  .letter::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(90deg,var(--mark) 0 14px,transparent 14px 28px);border-radius:5px 5px 0 0;opacity:.5}
  .line{display:flex;padding:5px 34px 5px 6px;border-radius:5px;position:relative;transition:background .15s}
  .line:hover,.line:focus-within{background:var(--paper-2)}
  .line p{flex:1;min-width:0}
  .regen{position:absolute;right:4px;top:7px;width:26px;height:26px;border-radius:50%;border:none;background:transparent;color:#A79C86;font-size:15px;cursor:pointer;opacity:0;transition:opacity .15s}
  .line:hover .regen,.line:focus-within .regen,.regen:focus-visible{opacity:1}
  .regen:hover{background:var(--paper-2);color:var(--ink)}
  .hint{font-size:12.5px;color:#666C96;margin-top:12px;text-align:center;line-height:1.7}

  .actions{margin-top:22px;display:flex;flex-direction:column;gap:10px}
  .btn{width:100%;border:none;border-radius:14px;padding:16px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:transform .1s,filter .15s}
  .btn:active{transform:scale(.985)}
  .btn:focus-visible{outline:2px solid var(--moon);outline-offset:3px}
  .btn-main{background:var(--moon);color:var(--night)}
  .btn-main:hover{filter:brightness(1.06)}
  .btn-sub{background:transparent;color:#9AA0C4;border:1px solid var(--night-3);font-weight:500}
  .btn-sub:hover{border-color:#4A5090;color:#B6BBDC}
  .linkbox{margin-top:14px;background:var(--night-2);border:1px solid var(--night-3);border-radius:12px;padding:13px 14px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8C92BC;word-break:break-all;line-height:1.6;max-height:88px;overflow:auto}
  .homelink{display:block;text-align:center;font-size:12.5px;color:#666C96;text-decoration:none;margin-top:22px}
  .homelink:hover{color:#B6BBDC}

  /* ================= 수신 화면 ================= */
  #view-read{min-height:86vh;display:flex;flex-direction:column;justify-content:center}

  /* 봉투 */
  .envelope{
    background:linear-gradient(#FBF7EF,#F4EDE0);border-radius:8px;padding:60px 26px 54px;
    text-align:center;cursor:pointer;position:relative;overflow:hidden;border:none;
    width:100%;font:inherit;color:var(--ink);
    box-shadow:0 22px 50px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.6);
  }
  .envelope::after{
    content:"";position:absolute;left:0;right:0;top:0;height:54%;
    background:linear-gradient(#F5EEE1,#EBE1CE);
    clip-path:polygon(0 0,100% 0,50% 100%);
    box-shadow:0 2px 6px rgba(0,0,0,.06);
    transition:transform .8s cubic-bezier(.5,0,.2,1);transform-origin:top;
  }
  .envelope.opening::after{transform:rotateX(180deg)}
  .seal{
    width:62px;height:62px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#EE9CAF,#D9647F);
    display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
    font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:20px;color:#fff;
    position:relative;z-index:2;box-shadow:0 4px 12px rgba(180,80,105,.4);
  }
  .env-title{font-family:var(--serif);font-size:20px;position:relative;z-index:2;color:#3A3527}
  .env-sub{font-size:13px;color:#9A927F;margin-top:10px;position:relative;z-index:2;letter-spacing:.02em}

  /* 편지지 */
  .sheet{
    background:var(--paper);color:var(--ink);border-radius:3px;
    padding:34px 26px 30px;position:relative;
    box-shadow:0 26px 60px rgba(0,0,0,.5), 0 2px 0 rgba(255,255,255,.25);
    animation:lift .9s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes lift{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}
  .sheet::before{
    content:"";position:absolute;inset:11px;border:1px solid var(--paper-line);
    border-radius:2px;pointer-events:none;
  }
  .sheet-top{
    display:flex;justify-content:space-between;align-items:baseline;
    padding-bottom:14px;margin-bottom:22px;border-bottom:1px solid var(--paper-line);
    position:relative;z-index:1;
  }
  .to{font-family:var(--serif);font-size:17px;color:var(--ink)}
  .to i{font-family:'IBM Plex Mono',monospace;font-style:normal;font-size:11px;color:var(--ink-faint);letter-spacing:.14em;margin-right:7px}
  .days{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);letter-spacing:.12em}

  .body{position:relative;z-index:1}
  .rl{
    font-family:var(--serif);font-size:17.5px;line-height:2.15;
    margin-bottom:16px;opacity:0;transform:translateY(9px);
    animation:rise .85s ease forwards;
  }
  @keyframes rise{to{opacity:1;transform:none}}

  .sign{
    margin-top:26px;padding-top:16px;border-top:1px solid var(--paper-line);
    display:flex;justify-content:space-between;align-items:flex-end;
    position:relative;z-index:1;
  }
  .date{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-faint);letter-spacing:.06em}
  .from{font-family:var(--serif);font-size:16px;color:var(--ink);text-align:right}
  .from i{font-family:'IBM Plex Mono',monospace;font-style:normal;font-size:11px;color:var(--ink-faint);letter-spacing:.14em;margin-right:7px}

  .dots{display:flex;justify-content:center;gap:5px;margin-top:24px}
  .dots i{width:4px;height:4px;border-radius:50%;background:rgba(228,137,158,.45)}
  .dots i:last-child{background:var(--moon)}
  .read-foot{margin-top:14px;text-align:center;font-size:12.5px;color:#7C82AA;letter-spacing:.02em}
  .read-actions{margin-top:30px;display:flex;flex-direction:column;gap:9px}
  .read-actions .btn{padding:14px;font-size:15px}

  @media (prefers-reduced-motion:reduce){
    .cell,.rl,.sheet{animation:none;opacity:1;transform:none}
    .envelope::after{transition:none}
    *{transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<!-- ===================== 작성 화면 ===================== -->
<div class="wrap" id="view-write">
  <div class="counter">
    <div class="grid100" id="grid" aria-hidden="true"></div>
    <div class="count-num" id="countNum">0</div>
    <div class="count-label">일째 되는 날</div>
  </div>

  <section>
    <div class="row2">
      <div>
        <label class="q" for="nameIn">받는 사람</label>
        <input type="text" id="nameIn" placeholder="자기야" maxlength="12" value="자기야">
      </div>
      <div>
        <label class="q" for="fromIn">보내는 사람 <em>· 선택</em></label>
        <input type="text" id="fromIn" placeholder="이름" maxlength="12">
      </div>
    </div>
  </section>

  <section>
    <div class="q" id="toneLabel">어떤 느낌으로 쓸까요?</div>
    <div class="chips" role="group" aria-labelledby="toneLabel" id="toneChips"></div>
  </section>

  <section>
    <div class="q" id="relLabel">요즘 두 사람은 어떤가요?</div>
    <div class="chips" role="group" aria-labelledby="relLabel" id="relChips"></div>
  </section>

  <section>
    <label class="q" for="momentIn">고마웠던 순간이 있다면 <em>· 안 쓰셔도 됩니다</em></label>
    <input type="text" id="momentIn" placeholder="예: 내가 아플 때 죽 사다준 거" maxlength="40">
  </section>

  <div class="letter-wrap">
    <div class="letter" id="letter"></div>
    <p class="hint">마음에 안 드는 줄에 손을 올리면 ↻ 로 다시 뽑을 수 있어요</p>
  </div>

  <div class="actions">
    <button class="btn btn-main" id="makeLink">편지 링크 만들기</button>
    <div class="linkbox hidden" id="linkbox"></div>
    <button class="btn btn-main hidden" id="copyLink">링크 복사하기</button>
    <button class="btn btn-sub hidden" id="previewBtn">받는 사람 화면 미리보기</button>
    <p class="hint hidden" id="sandboxNote">지금은 미리보기 창 안이라 링크가 열리지 않습니다. 배포한 뒤 확인해 주세요.</p>
    <button class="btn btn-sub" id="allBtn">전체 다시 뽑기</button>
  </div>
  <a class="homelink" href="../../">다른 테스트 보기 →</a>
</div>

<!-- ===================== 수신 화면 ===================== -->
<div class="wrap hidden" id="view-read">
  <button class="envelope" id="envelope">
    <div class="seal">100</div>
    <div class="env-title" id="envTitle">편지가 도착했어요</div>
    <div class="env-sub">눌러서 열어보세요</div>
  </button>

  <div class="hidden" id="opened">
    <div class="sheet">
      <div class="sheet-top">
        <div class="to"><i>TO.</i><span id="toName"></span></div>
        <div class="days">100 DAYS</div>
      </div>
      <div class="body" id="readBody"></div>
      <div class="sign">
        <div class="date" id="letterDate"></div>
        <div class="from hidden" id="fromWrap"><i>FROM.</i><span id="fromName"></span></div>
      </div>
    </div>
    <div class="dots" aria-hidden="true"></div>
    <p class="read-foot">100일 축하해요</p>
    <div class="read-actions">
      <button class="btn btn-main" id="writeBack">나도 편지 쓰기</button>
      <a class="btn btn-sub" href="../../" style="display:block;text-align:center;text-decoration:none;line-height:1.4">다른 테스트 보기</a>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" style="position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--moon);color:var(--night);font-weight:600;font-size:14.5px;padding:13px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 8px 26px rgba(0,0,0,.4);max-width:90vw;text-align:center"></div>

<script>
/* ===== 배포 주소 ===== */
const DEPLOY_BASE = "https://bingari69-jpg.github.io/couple-test/t/letter100/";
const isSandbox = () => !(/^https?:$/.test(location.protocol) && location.origin && location.origin!=="null");
const baseUrl   = () => isSandbox() ? DEPLOY_BASE : location.origin + location.pathname;

/* ===== 문장 뱅크 (버전 1) ===== */
const BANK_VERSION = 1;
const OPEN = {
  담백:["{n}, 오늘 100일이야.","{n}, 우리 만난 지 100일이래.","{n}, 벌써 100일이네.","{n}, 오늘로 딱 100일이다."],
  다정:["{n}, 오늘 우리 100일이야.","{n}, 100일이라는 게 오늘이더라.","{n}, 우리가 100일을 같이 지나왔어.","{n}, 오늘 무슨 날인지 알지? 100일이야."],
  웃김:["{n} 100일 축하해 ㅋㅋ","{n}, 100일이래. 나도 방금 알았어.","{n}, 100일인 거 알고 있었지? 나 세고 있었음.","{n}, 오늘 100일이다. 다들 박수."],
  진지:["{n}, 오늘로 100일이야.","{n}, 우리가 만난 지 100일이 됐어.","{n}, 100일이라는 시간이 지났네.","{n}, 오늘 100일이라 하루 종일 생각이 많았어."]
};
const REL = {
  "장거리":["멀리 있다 보니 못 본 날이 더 많았는데, 이상하게 그 시간이 아깝진 않았어.","만나는 날보다 기다리는 날이 훨씬 많았지.","화면 너머로 본 날이 더 많았는데도 가깝게 느껴졌어.","거리 때문에 지치는 날도 있었지만, 그때마다 네가 먼저 연락해줬어."],
  "자주 다퉈":["우리 자주 부딪히긴 했지만, 매번 다시 붙잡아준 게 너였어.","싸운 날도 꽤 되는데, 그래도 끝까지 안 놓은 건 우리 둘이더라.","서로 안 맞는 부분이 있다는 걸 이제는 알아. 그래도 여기까지 왔잖아.","티격태격하면서도 하루도 안 미워한 건 좀 신기해."],
  "조용한 편":["우리 둘 다 말수가 많은 편은 아닌데, 같이 있으면 조용한 게 안 어색했어.","굳이 말 안 해도 편했던 시간이 많았어.","말보다 그냥 옆에 있는 게 익숙해진 100일이었어.","우리는 시끄럽지 않아서 좋아."],
  "매일 붙어있어":["거의 매일 봤는데도 아직 안 질리는 게 신기해.","하루도 빠짐없이 연락한 거 알아? 나 세어봤어.","매일 보다 보니 기념일이 좀 어색하긴 한데,","붙어 있는 게 당연해져서, 가끔 고마운 걸 잊고 있었어."],
  "이제 막 편해짐":["처음엔 서로 조심스러웠는데, 요즘은 네 앞에서 아무렇지 않게 있을 수 있어서 좋아.","이제야 좀 편해진 것 같아. 그게 제일 마음에 들어.","낯가리던 게 얼마 전인데 벌써 이만큼 편해졌네.","요즘 너한테 아무 말이나 할 수 있게 된 게 좋아."]
};
const MOMENT = {
  담백:["{m}, 그거 아직 기억나.","{m}. 그때 말은 안 했는데 고마웠어.","{m}. 그건 잊고 있다가 요즘 다시 생각났어.","{m}, 그거 하나는 확실히 고마워."],
  다정:["{m}, 그날 진짜 고마웠어.","{m}. 그거 생각하면 아직도 마음이 좀 이상해.","{m}. 그때 네가 없었으면 어땠을까 싶어.","{m}, 그게 나한테는 꽤 큰 일이었어."],
  웃김:["{m} 그건 좀 반칙이었지 ㅋㅋ 고마웠어.","{m}. 그거 하나로 한동안 버텼다.","{m}. 그때 감동받은 거 티 안 내려고 애썼어.","{m} 그거 아직 안 잊었다."],
  진지:["{m}, 그 순간이 오래 남아 있어.","{m}. 그때부터였던 것 같아.","{m}. 그날 이후로 너를 다르게 보게 됐어.","{m}, 그게 지금까지 이어진 것 같아."]
};
const BODY = {
  담백:["고맙다는 말은 잘 안 하는데, 오늘은 해두고 싶었어.","말로 잘 못 해서 이렇게라도 써.","표현이 서툴러서 그렇지, 늘 고마워하고 있어.","특별한 말은 못 하겠고, 그냥 좋다는 얘기야."],
  다정:["네가 옆에 있어서 하루가 좀 덜 힘들었어.","네 덕분에 웃은 날이 훨씬 많았어.","별거 아닌 날들도 너랑 있으면 괜찮았어.","고맙다는 말이 부족한 것 같아서 자꾸 다른 말을 찾게 돼."],
  웃김:["이런 거 잘 못 쓰는데 오늘만 봐줘.","손발 오그라들어서 여기까지가 최선이야.","이거 쓰는 데 30분 걸렸다. 진심이라는 뜻이야.","칭찬 한 번 하는 게 이렇게 어려운 일인 줄 몰랐어."],
  진지:["네가 나한테 어떤 사람인지 요즘 자주 생각해.","만나기 전보다 지금의 내가 더 마음에 들어. 그게 네 덕분인 것 같아.","당연한 게 하나도 없다는 걸 너 만나고 알았어.","이 시간이 나한테 꽤 중요한 시간이었어."]
};
const CLOSE = {
  담백:["다음 100일도 잘 부탁해.","앞으로도 이대로 가자.","오래 보자.","200일에 또 쓸게."],
  다정:["다음 100일은 더 많이 웃자.","앞으로도 지금처럼만 있어줘.","오래오래 옆에 있자.","사랑해. 100일 축하해."],
  웃김:["…사랑해. 이거 캡처하지 마.","여기까지 읽었으면 답장은 필수다.","다음 100일도 잘 부탁드립니다.","오늘은 네가 사줘. 100일이잖아."],
  진지:["앞으로의 시간도 너와 보내고 싶어.","다음 100일도, 그다음도 함께 있자.","고마워. 그리고 사랑해.","오래 함께 있자, 우리."]
};
const TONES=Object.keys(OPEN), RELS=Object.keys(REL);

/* ===== 상태 ===== */
const state={tone:1,rel:3,idx:[0,0,0,0],name:"자기야",from:"",moment:""};
const toneName=()=>TONES[state.tone], relName=()=>RELS[state.rel];
const pick=(a,i)=>a[i%a.length];
function slots(){const t=toneName(),m=state.moment.trim();
  return [OPEN[t],REL[relName()],m?MOMENT[t]:BODY[t],CLOSE[t]];}
function lines(){const m=state.moment.trim();
  return slots().map((b,i)=>pick(b,state.idx[i]).replace("{n}",state.name||"자기야").replace("{m}",m));}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ===== 해시 ===== */
function b64e(s){const b=new TextEncoder().encode(s);let x="";b.forEach(c=>x+=String.fromCharCode(c));
  return btoa(x).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function b64d(s){s=s.replace(/-/g,"+").replace(/_/g,"/");s+="=".repeat((4-s.length%4)%4);
  const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  return new TextDecoder().decode(u);}
function today(){const d=new Date();
  return d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0");}
function payload(){
  const p={v:BANK_VERSION,n:state.name||"자기야",t:state.tone,r:state.rel,i:state.idx.slice(),d:today()};
  if(state.moment.trim())p.m=state.moment.trim();
  if(state.from.trim())p.f=state.from.trim();
  return p;
}
function readHash(){
  const h=location.hash;
  if(!h.startsWith("#l="))return null;
  try{const p=JSON.parse(b64d(h.slice(3)));
    return (p&&typeof p.t==="number"&&Array.isArray(p.i))?p:null;}catch(e){return null;}
}
function linesFrom(p){
  const t=TONES[p.t]||TONES[0], r=RELS[p.r]||RELS[0], m=(p.m||"").trim();
  return [OPEN[t],REL[r],m?MOMENT[t]:BODY[t],CLOSE[t]]
    .map((b,i)=>pick(b,p.i[i]||0).replace("{n}",p.n||"자기야").replace("{m}",m));
}

/* ===== 작성 화면 ===== */
let madeUrl="";
function render(){
  const el=document.getElementById("letter"); el.innerHTML="";
  lines().forEach((txt,i)=>{
    const d=document.createElement("div"); d.className="line";
    d.innerHTML=`<p>${esc(txt)}</p><button class="regen" aria-label="${i+1}번째 줄 다시 뽑기" data-i="${i}">↻</button>`;
    el.appendChild(d);
  });
  ["linkbox","copyLink","previewBtn","sandboxNote"].forEach(id=>document.getElementById(id).classList.add("hidden"));
  document.getElementById("makeLink").textContent="편지 링크 만들기";
  madeUrl="";
}
function buildChips(id,items,key){
  const box=document.getElementById(id);
  items.forEach((v,i)=>{
    const b=document.createElement("button");
    b.className="chip";b.type="button";b.textContent=v;
    b.setAttribute("aria-pressed",state[key]===i);
    b.onclick=()=>{state[key]=i;
      [...box.children].forEach((c,j)=>c.setAttribute("aria-pressed",j===i));
      state.idx=state.idx.map(()=>Math.floor(Math.random()*4));render();};
    box.appendChild(b);
  });
}
buildChips("toneChips",TONES,"tone");
buildChips("relChips",RELS,"rel");

document.getElementById("letter").addEventListener("click",e=>{
  const b=e.target.closest(".regen"); if(!b)return;
  const i=+b.dataset.i; state.idx[i]=(state.idx[i]+1)%4; render();
});
document.getElementById("nameIn").oninput=e=>{state.name=e.target.value;render();};
document.getElementById("fromIn").oninput=e=>{state.from=e.target.value;};
document.getElementById("momentIn").oninput=e=>{state.moment=e.target.value;render();};
document.getElementById("allBtn").onclick=()=>{
  state.idx=state.idx.map(()=>Math.floor(Math.random()*4));render();toast("새로 뽑았어요");};

document.getElementById("makeLink").onclick=()=>{
  madeUrl=baseUrl()+"#l="+b64e(JSON.stringify(payload()));
  const box=document.getElementById("linkbox");
  box.textContent=madeUrl; box.classList.remove("hidden");
  document.getElementById("copyLink").classList.remove("hidden");
  document.getElementById("previewBtn").classList.remove("hidden");
  document.getElementById("makeLink").textContent="편지 링크 다시 만들기";
  document.getElementById("sandboxNote").classList.toggle("hidden",!isSandbox());
  toast("링크가 만들어졌어요");
};
document.getElementById("copyLink").onclick=async()=>{
  let ok=false;
  try{await navigator.clipboard.writeText(madeUrl);ok=true;}
  catch(e){
    const ta=document.createElement("textarea");
    ta.value=madeUrl;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{ok=document.execCommand("copy");}catch(e2){}
    ta.remove();
  }
  toast(ok?"복사됐어요. 카톡에 붙여넣으세요":"링크를 길게 눌러 복사해 주세요");
};
document.getElementById("previewBtn").onclick=()=>showRead(payload());

let tt; function toast(m){const el=document.getElementById("toast");
  el.textContent=m;el.style.opacity="1";el.style.transform="translate(-50%,0)";
  clearTimeout(tt);tt=setTimeout(()=>{el.style.opacity="0";el.style.transform="translate(-50%,20px)";},2400);}

/* ===== 수신 화면 ===== */
function showRead(p){
  document.getElementById("view-write").classList.add("hidden");
  document.getElementById("view-read").classList.remove("hidden");
  document.getElementById("envTitle").textContent=(p.n? p.n+"에게 ":"")+"편지가 도착했어요";
  window.scrollTo(0,0);

  const env=document.getElementById("envelope");
  env.onclick=()=>{
    env.classList.add("opening");
    setTimeout(()=>{
      env.classList.add("hidden");
      document.getElementById("toName").textContent=p.n||"자기야";
      document.getElementById("letterDate").textContent=p.d||today();
      if(p.f){
        document.getElementById("fromName").textContent=p.f;
        document.getElementById("fromWrap").classList.remove("hidden");
      }
      const box=document.getElementById("readBody"); box.innerHTML="";
      linesFrom(p).forEach((t,i)=>{
        const d=document.createElement("p"); d.className="rl"; d.textContent=t;
        d.style.animationDelay=(500+i*430)+"ms";
        box.appendChild(d);
      });
      const dots=document.querySelector(".dots");
      dots.innerHTML=""; for(let i=0;i<10;i++)dots.appendChild(document.createElement("i"));
      document.getElementById("opened").classList.remove("hidden");
    },820);
  };
}
document.getElementById("writeBack").onclick=()=>{location.hash="";location.reload();};

/* ===== 100칸 + 진입 ===== */
(function(){
  const grid=document.getElementById("grid");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  for(let i=0;i<100;i++){
    const c=document.createElement("div");
    c.className="cell"+(i===99?" last":"");
    c.style.animationDelay=(reduce?0:i*11)+"ms";
    grid.appendChild(c);
  }
  const num=document.getElementById("countNum");
  if(reduce){num.textContent="100";}
  else{let n=0;const t=setInterval(()=>{n+=2;if(n>=100){n=100;clearInterval(t);}num.textContent=n;},22);}
})();

const p0=readHash();
if(p0) showRead(p0); else render();
</script>
</body>
</html>
