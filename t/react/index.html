<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>반응속도 대결</title>

<meta property="og:type" content="website">
<meta property="og:title" content="반응속도 — 나 0.21초. 넌?">
<meta property="og:description" content="초록으로 바뀌는 순간 눌러. 3번 평균. 누가 더 빠를까.">
<meta property="og:image" content="https://bingari69-jpg.github.io/couple-test/og/og-react.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://bingari69-jpg.github.io/couple-test/t/react/">
<meta name="twitter:card" content="summary_large_image">

<script src="../../assets/analytics.js"></script>
<script src="../../assets/kakao-share.js"></script>
<script src="../../assets/bet.js"></script>
<script src="../../assets/duel-engine.js"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#FFF8E7; --card:#FFFFFF; --line:#F0E4C8; --ink:#1F1B16; --sub:#7A6E5E; --dim:#B5A88F;
    --red:#FF5A5F; --blue:#2D7DFF; --yellow:#FFC94D; --green:#22C55E;
    --sp:clamp(16px,4vw,24px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;line-height:1.5;min-height:100vh;padding:var(--sp) var(--sp) 56px;-webkit-user-select:none;user-select:none}
  .wrap{max-width:480px;margin:0 auto}
  .hidden{display:none!important}
  .screen{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--red);background:#fff;border:2px solid var(--red);border-radius:999px;padding:5px 12px;margin-bottom:14px}
  h1{font-size:clamp(28px,8vw,38px);font-weight:900;line-height:1.25;letter-spacing:-.02em;margin-bottom:10px}
  h1 b{color:var(--blue)}
  .lead{font-size:16px;color:var(--sub);line-height:1.6;margin-bottom:18px}
  .q{font-size:14px;color:var(--sub);margin:16px 0 8px;display:block;font-weight:600}
  input[type=text]{width:100%;background:#fff;border:2px solid var(--line);color:var(--ink);border-radius:14px;padding:14px 16px;font:inherit;font-size:18px;font-weight:700}
  input::placeholder{color:var(--dim);font-weight:500}
  input:focus{outline:none;border-color:var(--blue)}

  /* 타이머 */
  .clock{background:#fff;border:3px solid var(--line);border-radius:28px;padding:34px 20px 30px;text-align:center;margin:18px 0;box-shadow:0 10px 30px rgba(31,27,22,.06)}
  .clock .num{font-size:clamp(64px,22vw,96px);font-weight:900;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);min-height:1em}
  .clock .num.hide{color:var(--dim);letter-spacing:.2em}
  .clock{cursor:pointer;transition:background .12s,border-color .12s;touch-action:manipulation}
  .clock.wait{background:var(--red);border-color:var(--red)} .clock.wait .num,.clock.wait .msg,.clock.wait .unit{color:#fff}
  .clock.go{background:var(--green);border-color:var(--green)} .clock.go .num{color:#fff;font-size:clamp(72px,26vw,110px)}
  .clock.foul{background:#FFE8E9;border-color:var(--red)} .clock.foul .num{color:var(--red);font-size:clamp(40px,12vw,56px)}
  .clock.shown .num{color:var(--blue)}
  .clock .unit{font-size:16px;color:var(--sub);margin-top:6px;font-weight:600}
  .clock .msg{font-size:15px;color:var(--sub);margin-top:14px;min-height:1.4em}
  .clock .msg b{color:var(--red)}
  .bigbtn{width:100%;border:none;border-radius:22px;padding:26px;font:inherit;font-size:26px;font-weight:900;cursor:pointer;transition:transform .08s,filter .15s;margin-top:6px;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
  .bigbtn:active{transform:scale(.97)}
  .bigbtn.start{background:var(--blue);color:#fff}
  .bigbtn.stop{background:var(--red);color:#fff;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,95,.45)}50%{box-shadow:0 0 0 14px rgba(255,90,95,0)}}
  .bigbtn:disabled{opacity:.4;cursor:default;animation:none}

  .btn{width:100%;border:none;border-radius:16px;padding:16px;font:inherit;font-size:17px;font-weight:800;cursor:pointer;transition:transform .1s;margin-top:10px}
  .btn:active{transform:scale(.985)}
  .btn-main{background:var(--yellow);color:var(--ink)}
  .btn-blue{background:var(--blue);color:#fff}
  .btn-sub{background:#fff;color:var(--sub);border:2px solid var(--line);font-weight:600}
  .btn-ghost{background:transparent;color:#999;font-size:14px;border:none;font-weight:500;padding:12px}
  .linkbox{margin-top:12px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--sub);word-break:break-all;line-height:1.6;max-height:76px;overflow:auto;-webkit-user-select:text;user-select:text}
  .hint{font-size:13px;color:var(--dim);margin-top:12px;text-align:center;line-height:1.6}
  .homelink{display:block;text-align:center;font-size:13px;color:var(--dim);text-decoration:none;margin-top:22px}
  .card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin:14px 0}
  .lockrow{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--sub)} .lockrow .e{font-size:24px}
  .lockrow b{color:var(--ink)}

  /* 결과 */
  .versus{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:8px;margin:16px 0 10px}
  .side{background:#fff;border:3px solid var(--line);border-radius:22px;padding:18px 8px 14px;text-align:center}
  .side .n{font-size:14px;color:var(--sub);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side .t{font-size:clamp(28px,9vw,40px);font-weight:900;letter-spacing:-.03em;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
  .side .t small{font-size:.45em;font-weight:700;color:var(--sub)}
  .side .d{font-size:13px;color:var(--sub);margin-top:6px;font-weight:600}
  .side.win{border-color:var(--yellow);background:#FFFBEE}
  .side.win .t{color:var(--blue)}
  .side.lose{opacity:.6}
  .vs{align-self:center;font-size:14px;font-weight:900;color:var(--dim)}
  .verdict{text-align:center;font-size:clamp(26px,8vw,34px);font-weight:900;letter-spacing:-.02em;margin:6px 0 2px}
  .verdict.win{color:var(--blue)} .verdict.lose{color:var(--red)} .verdict.tie{color:var(--sub)}
  .sub-verdict{text-align:center;font-size:15px;color:var(--sub);font-weight:600}
  .title-badge{margin:14px auto 0;display:table;background:#fff;border:2px solid var(--yellow);border-radius:999px;padding:9px 18px;font-size:15px;font-weight:800}
  .tally{margin-top:14px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 16px;text-align:center;font-size:15px;font-weight:700}
  .tally .big{font-size:26px;font-weight:900;letter-spacing:.02em;margin-top:2px}
  .tally .big b{color:var(--blue)}
  .tally .rows{font-size:12.5px;color:var(--sub);font-weight:500;margin-top:8px;line-height:1.7}
  .notyet{margin-top:14px;padding:12px 14px;background:#fff;border:2px dashed var(--yellow);border-radius:14px;font-size:14px;line-height:1.55}
  .notyet b{color:var(--red)}
  .next{margin-top:22px} .next h3{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:10px}
  .next a{display:block;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 15px;text-decoration:none;color:var(--ink);margin-bottom:8px;font-size:15px;font-weight:700}
  .next a small{display:block;font-weight:500;font-size:12.5px;color:var(--dim);margin-top:2px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-weight:800;font-size:15px;padding:13px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 8px 26px rgba(0,0,0,.25);max-width:90vw;text-align:center}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">

<!-- ============ 플레이 (도전자·응답자 공용) ============ -->
<section class="screen" id="s-play">
  <span class="tag" id="playTag">반응속도</span>
  <h1 id="playHead">초록으로 바뀌면<br><b>바로 눌러.</b></h1>
  <p class="lead" id="playLead">빨간 화면에서 기다리다가 초록이 되는 순간 눌러. <b>3번 평균</b>이 내 기록. 초록 전에 누르면 무효.</p>

  <div class="card hidden" id="lockedCard"><div class="lockrow"><span class="e">🔒</span><span><b id="lockName"></b>의 기록은 네가 3번 끝낸 뒤에 공개돼.</span></div></div>
  <div class="card hidden" id="tallyCard"><div id="tallyText" style="font-size:14px;line-height:1.6"></div></div>

  <label class="q" for="nameIn">내 이름 (선택)</label>
  <input type="text" id="nameIn" placeholder="비워도 돼요" maxlength="10">

  <div class="clock" id="clock">
    <div class="num" id="num">준비</div>
    <div class="unit" id="unit">눌러서 시작</div>
    <div class="msg" id="msg">화면 아무 데나 누르면 돼</div>
  </div>
  <button class="bigbtn start" id="bigBtn">시작</button>

  <div id="afterPlay" class="hidden">
    <div class="linkbox hidden" id="linkbox"></div>
    <button class="btn btn-main" id="kakaoBtn" style="background:#FEE500;color:#191600">💬 카톡으로 도전장 보내기</button>
    <button class="btn btn-ghost" id="copyBtn">링크만 복사</button>
    <p class="hint hidden" id="sandboxNote">지금은 미리보기 창이라 링크가 안 열려. 배포 후 확인.</p>
    <p class="hint">3번 평균으로 기록. 다시 하기 없음 — 상대도 3번이니까 공평하게.</p>
  </div>
  <a class="homelink" href="../../">다른 놀이 보기 →</a>
</section>

<!-- ============ 결과 ============ -->
<section class="screen hidden" id="s-result">
  <span class="tag" id="resTag">결과</span>
  <div class="versus">
    <div class="side" id="sideA"><div class="n" id="nameA"></div><div class="t" id="tA"></div><div class="d" id="dA"></div></div>
    <div class="vs">VS</div>
    <div class="side" id="sideB"><div class="n" id="nameB"></div><div class="t" id="tB"></div><div class="d" id="dB"></div></div>
  </div>
  <div class="verdict" id="verdict"></div>
  <p class="sub-verdict" id="subVerdict"></p>
  <div class="title-badge" id="titleBadge"></div>
  <div class="tally hidden" id="tallyBox"></div>
  <div class="notyet hidden" id="notYet">⚠️ <b>상대는 아직 결과 몰라.</b> 결과 링크를 보내거나, 재도전을 걸면 이번 결과가 같이 가.</div>
  <div id="respActions" class="hidden">
    <button class="btn btn-main" id="kakaoRes" style="background:#FEE500;color:#191600">💬 카톡으로 결과 보내기</button>
    <button class="btn btn-ghost" id="sendResult">링크만 복사</button>
    <div class="linkbox hidden" id="resLinkbox"></div>
    <button class="btn btn-blue" id="again">재도전 — 한 판 더</button>
  </div>
  <div id="viewActions" class="hidden">
    <button class="btn btn-blue" id="again2">재도전 — 한 판 더</button>
  </div>
  <div class="next"><h3>다음은 이거 어때?</h3><div id="nextList"></div></div>
  <a class="btn btn-sub" href="../../" style="display:block;text-align:center;text-decoration:none">다른 놀이 보기</a>
</section>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== 반응속도 대결 =====
   공통 부분(도전장·봉인·전적·결과 화면)은 assets/duel-engine.js 에 있다.
   여기에는 3회 측정 화면만 남는다. */
const TRIES=3;
const fmt=ms=>(ms/1000).toFixed(3);
function titleFor(ms){
  if(ms<=180) return "번개";
  if(ms<=220) return "빠른 편";
  if(ms<=280) return "보통 사람";
  if(ms<=350) return "느긋함";
  return "졸았어?";
}
const NEXT=[
  {path:"../ten/",      title:"10초 맞추기", desc:"안 보고 10초 세다가 멈추기."},
  {path:"../rps/",      title:"가위바위보 도전장", desc:"내가 먼저 낸다. 네가 이길 수 있는지 골라봐."},
  {path:"../delivery/", title:"배달 텔레파시",    desc:"내가 뭐 시킬지 맞혀봐."},
  {path:"../mbti/",     title:"내 MBTI 몇 글자나 맞힐래?", desc:"4문항으로 나온 네 글자."}
];

const state = Duel.setup({
  deployBase:"https://bingari69-jpg.github.io/couple-test/t/react/",
  og:"https://bingari69-jpg.github.io/couple-test/og/og-react-sq.png",
  gameName:"반응속도",
  challengeDesc:"초록으로 바뀌는 순간 누르기. 3회 평균으로 겨룬다. 내 기록은 네가 한 뒤 공개.",
  next:NEXT,
  titleFor,                         // 값이 작을수록 빠르다 = 기본 비교 그대로
  state:{phase:"idle",tries:[],t0:0,timer:0},
  recordCell:x=>fmt(x.v)+"<small>초</small>",
  detailCell:()=>"3회 평균",
  histRow:(r,isA,i)=>`${i+1}판 · ${esc(who(r[0],isA))} ${fmt(r[1])} vs ${esc(who(r[2],!isA))} ${fmt(r[3])}`,
  verdictText:o=> o==="win"?"내가 더 빨라!":o==="lose"?"상대가 더 빨라":"완전 똑같아?!",
  subVerdictText:(o,me,them,meL,themL,em,et)=>
    o==="tie"?"천분의 일 초까지 같은 건 거의 기적.":`${subj(o==="win"?meL:themL)} ${fmt(Math.abs(em-et))}초 더 빨랐어.`,
  challengeHead:p=>`<b>${esc(p.n||"상대")}</b>${subjTail(p.n||"상대")} 도전했다.<br>더 빨리 눌러봐.`,
  againHead:()=>`재도전. 이번엔 <b>내가 먼저</b> 기록 낸다.`,
  resultTitle:(me,them,tail,nm)=>`${nm(me.n)}${fmt(me.v)} vs ${nm(them.n)}${fmt(them.v)}${tail}`,
  resultDesc:"반응속도 3회 평균. 재도전은 여기서.",
  resetPlay(){
    state.phase="idle";state.tries=[];
    setPanel("","준비","화면 아무 데나 누르면 돼");$("bigBtn").classList.remove("hidden");
  }
});

/* ===== 반응속도 (3회 평균) ===== */
function setPanel(cls,big,msg){const c=$("clock");c.className="clock "+cls;$("num").textContent=big;$("msg").innerHTML=msg;}
function armRound(){
  state.phase="wait";
  setPanel("wait","기다려…",`초록으로 바뀌면 <b>화면을 눌러!</b> · ${state.tries.length+1}/${TRIES}`);
  const delay=1500+Math.random()*2500;
  state.timer=setTimeout(()=>{ state.phase="go"; state.t0=performance.now(); setPanel("go","지금!",""); },delay);
}
function hit(){
  if(state.phase==="idle"){
    state.tries=[];$("bigBtn").classList.add("hidden");$("afterPlay").classList.add("hidden");armRound();return;
  }
  if(state.phase==="wait"){                           // 부정출발
    clearTimeout(state.timer);state.phase="foul";
    setPanel("foul","너무 빨라!","초록 되기 전에 눌렀어. <b>이 판은 무효.</b> 눌러서 다시");
    return;
  }
  if(state.phase==="foul"){armRound();return;}
  if(state.phase==="go"){
    const ms=Math.round(performance.now()-state.t0);
    state.tries.push(ms);state.phase="shown";
    setPanel("shown",fmt(ms)+"초",state.tries.length<TRIES?`${state.tries.length}/${TRIES} · 눌러서 다음`:"3번 끝! 눌러서 봉인");
    return;
  }
  if(state.phase==="shown"){
    if(state.tries.length<TRIES){armRound();return;}
    finishPlay();
  }
}
$("clock").addEventListener("pointerdown",e=>{e.preventDefault();hit();});
$("bigBtn").onclick=()=>hit();
function finishPlay(){
  state.phase="done";
  const ms=Math.round(state.tries.reduce((a,b)=>a+b,0)/state.tries.length);
  setPanel("shown","🔒", state.incoming ? "개봉 중…" : `3회 평균 <b>${fmt(ms)}초</b> 봉인. 상대가 한 뒤에 같이 열려`);
  Duel.finish(ms);
}

Duel.start();
</script>
</body>
</html>
